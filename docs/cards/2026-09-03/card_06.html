<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY DISPUTE<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Naming <span class="y">Seongnam</span> as <span class="y">Seoul</span>'s Sewage Plant Site Disrespects Residents</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="80" width="300" height="170" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="210" y="130" font-size="26" font-weight="700" fill="#0075C1" text-anchor="middle">SEOUL</text>
        <text x="210" y="170" font-size="16" fill="#00205D" text-anchor="middle">Proposes Off-Site</text>
        <text x="210" y="195" font-size="16" fill="#00205D" text-anchor="middle">Sewage Treatment</text>
        <text x="210" y="230" font-size="16" fill="#888780" text-anchor="middle">SOURCE CITY</text>
        <path d="M 380 165 L 500 165" stroke="#DDA11D" stroke-width="4" stroke-dasharray="8,6"/>
        <polygon points="500,155 520,165 500,175" fill="#DDA11D"/>
        <text x="440" y="150" font-size="18" font-weight="700" fill="#DDA11D" text-anchor="middle">?</text>
        <rect x="540" y="80" width="300" height="170" rx="12" fill="#F5F7FA" stroke="#DDA11D" stroke-width="2"/>
        <text x="690" y="130" font-size="26" font-weight="700" fill="#DDA11D" text-anchor="middle">SEONGNAM</text>
        <text x="690" y="170" font-size="16" fill="#00205D" text-anchor="middle">Residents Object</text>
        <text x="690" y="195" font-size="16" fill="#00205D" text-anchor="middle">to Being Named</text>
        <text x="690" y="230" font-size="16" fill="#888780" text-anchor="middle">CANDIDATE SITE</text>
        <text x="450" y="300" font-size="18" font-weight="700" fill="#00205D" text-anchor="middle" letter-spacing="2">NIMBY · INTER-CITY CONFLICT</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Seongnam</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v"><span class="b">Siting Dispute</span></div></div>
    <div class="fact"><div class="k">STANCE</div><div class="v">Residents Oppose</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
