<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>URBAN DEVELOPMENT<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Tower Over Sewage Plant: <span class="y">Tancheon</span> Redevelopment Solution <span class="b">Already Existed</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="140" y="50" width="180" height="240" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="230" y="45" font-size="16" font-weight="700" fill="#888780" text-anchor="middle">PRECEDENT</text>
        <rect x="150" y="60" width="160" height="30" fill="#0075C1"/>
        <rect x="150" y="95" width="160" height="30" fill="#B5D4F4"/>
        <rect x="150" y="130" width="160" height="30" fill="#0075C1"/>
        <rect x="150" y="165" width="160" height="30" fill="#B5D4F4"/>
        <rect x="150" y="200" width="160" height="30" fill="#F5F7FA" stroke="#00205D"/>
        <text x="230" y="220" font-size="14" fill="#00205D" text-anchor="middle" font-weight="700">SEWAGE PLANT</text>
        <text x="230" y="270" font-size="16" fill="#00205D" text-anchor="middle" font-weight="700">Existing Case</text>
        <path d="M 350 170 L 460 170" stroke="#DDA11D" stroke-width="4"/>
        <polygon points="460,160 480,170 460,180" fill="#DDA11D"/>
        <rect x="500" y="30" width="220" height="260" fill="#E6F1FB" stroke="#DDA11D" stroke-width="3"/>
        <text x="610" y="25" font-size="16" font-weight="700" fill="#DDA11D" text-anchor="middle">TANCHEON PLAN</text>
        <rect x="515" y="45" width="190" height="18" fill="#DDA11D"/>
        <rect x="515" y="66" width="190" height="18" fill="#0075C1"/>
        <rect x="515" y="87" width="190" height="18" fill="#DDA11D"/>
        <rect x="515" y="108" width="190" height="18" fill="#0075C1"/>
        <rect x="515" y="129" width="190" height="18" fill="#DDA11D"/>
        <rect x="515" y="150" width="190" height="18" fill="#0075C1"/>
        <rect x="515" y="171" width="190" height="18" fill="#DDA11D"/>
        <rect x="515" y="192" width="190" height="30" fill="#F5F7FA" stroke="#00205D"/>
        <text x="610" y="212" font-size="14" fill="#00205D" text-anchor="middle" font-weight="700">SEWAGE PLANT</text>
        <text x="610" y="270" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">32 FLOORS</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SITE</div><div class="v"><span class="y">Tancheon</span></div></div>
    <div class="fact"><div class="k">APPROACH</div><div class="v"><span class="b">Overbuild</span></div></div>
    <div class="fact"><div class="k">STATUS</div><div class="v">Blueprint Ready</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
