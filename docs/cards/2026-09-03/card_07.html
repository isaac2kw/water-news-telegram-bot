<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:48px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>OPERATIONS AWARD<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Chungju Suanbo</span> WWTP Selected <span class="b">Best in Group II</span> of 2025 Operations Evaluation</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="60" width="380" height="220" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="250" y="100" font-size="18" font-weight="700" fill="#888780" text-anchor="middle" letter-spacing="2">GROUP I · LARGE</text>
        <line x1="90" y1="120" x2="410" y2="120" stroke="#B5D4F4"/>
        <text x="250" y="180" font-size="26" font-weight="700" fill="#00205D" text-anchor="middle">Metropolitan</text>
        <text x="250" y="215" font-size="26" font-weight="700" fill="#00205D" text-anchor="middle">WWTPs</text>
        <text x="250" y="260" font-size="16" fill="#888780" text-anchor="middle">— separate ranking —</text>
        <rect x="460" y="60" width="380" height="220" rx="12" fill="#E6F1FB" stroke="#DDA11D" stroke-width="3"/>
        <text x="650" y="100" font-size="18" font-weight="700" fill="#DDA11D" text-anchor="middle" letter-spacing="2">GROUP II · MID/SMALL</text>
        <line x1="490" y1="120" x2="810" y2="120" stroke="#DDA11D"/>
        <text x="650" y="180" font-size="30" font-weight="700" fill="#DDA11D" text-anchor="middle">Suanbo</text>
        <text x="650" y="220" font-size="24" font-weight="700" fill="#00205D" text-anchor="middle">BEST 2025</text>
        <text x="650" y="260" font-size="16" fill="#00205D" text-anchor="middle">Category Winner</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">YEAR</div><div class="v">2025 Review</div></div>
    <div class="fact"><div class="k">GROUP</div><div class="v"><span class="b">Group II</span></div></div>
    <div class="fact"><div class="k">WINNER</div><div class="v"><span class="y">Suanbo</span> WWTP</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
