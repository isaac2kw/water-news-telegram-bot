<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>REGULATION<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Jeju</span> Private <span class="b">Sewage Facility</span> Rules Reinforced in Name Only, Report Finds</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="80" width="360" height="180" fill="#E6F1FB" rx="12"/>
        <text x="240" y="120" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">POLICY ON PAPER</text>
        <line x1="100" y1="140" x2="380" y2="140" stroke="#B5D4F4" stroke-width="1"/>
        <text x="240" y="170" font-family="Helvetica" font-size="16" fill="#0075C1" text-anchor="middle" font-weight="600">Stricter installation rules</text>
        <text x="240" y="200" font-family="Helvetica" font-size="16" fill="#0075C1" text-anchor="middle" font-weight="600">Mandatory maintenance</text>
        <text x="240" y="230" font-family="Helvetica" font-size="16" fill="#0075C1" text-anchor="middle" font-weight="600">Inspection obligations</text>

        <rect x="480" y="80" width="360" height="180" fill="#F5F7FA" rx="12" stroke="#DDA11D" stroke-width="3"/>
        <text x="660" y="120" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">REALITY ON SITE</text>
        <line x1="520" y1="140" x2="800" y2="140" stroke="#DDA11D" stroke-width="1"/>
        <text x="660" y="170" font-family="Helvetica" font-size="16" fill="#DDA11D" text-anchor="middle" font-weight="700">Weak enforcement</text>
        <text x="660" y="200" font-family="Helvetica" font-size="16" fill="#DDA11D" text-anchor="middle" font-weight="700">Low compliance</text>
        <text x="660" y="230" font-family="Helvetica" font-size="16" fill="#DDA11D" text-anchor="middle" font-weight="700">Groundwater at risk</text>

        <text x="450" y="295" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">Gap between regulation and field implementation</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Jeju Island</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v">Enforcement Gap</div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">Private Sewage</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
