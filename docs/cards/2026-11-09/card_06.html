<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>GOVERNANCE<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Geumsan County</span> <span class="b">32.5B KRW</span> Sewage Operation Contract Faces Suspicion of Leaked Review Info</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="100" width="220" height="120" fill="#E6F1FB" rx="10"/>
        <text x="150" y="140" font-family="Helvetica" font-size="16" fill="#00205D" text-anchor="middle" font-weight="700">TENDER</text>
        <text x="150" y="175" font-family="Helvetica" font-size="22" fill="#0075C1" text-anchor="middle" font-weight="700">32.5B KRW</text>
        <text x="150" y="200" font-family="Helvetica" font-size="13" fill="#888780" text-anchor="middle">Sewage O&amp;M Contract</text>

        <polygon points="270,160 320,160 320,145 350,170 320,195 320,180 270,180" fill="#0075C1"/>

        <rect x="360" y="100" width="220" height="120" fill="#F5F7FA" rx="10" stroke="#DDA11D" stroke-width="3"/>
        <text x="470" y="140" font-family="Helvetica" font-size="16" fill="#00205D" text-anchor="middle" font-weight="700">REVIEW</text>
        <text x="470" y="175" font-family="Helvetica" font-size="20" fill="#DDA11D" text-anchor="middle" font-weight="700">Closed Panel</text>
        <text x="470" y="200" font-family="Helvetica" font-size="13" fill="#888780" text-anchor="middle">Confidential Process</text>

        <polygon points="590,160 640,160 640,145 670,170 640,195 640,180 590,180" fill="#DDA11D"/>

        <rect x="680" y="100" width="180" height="120" fill="#DDA11D" rx="10"/>
        <text x="770" y="140" font-family="Helvetica" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">ALLEGATION</text>
        <text x="770" y="175" font-family="Helvetica" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">LEAK &amp;</text>
        <text x="770" y="200" font-family="Helvetica" font-size="18" fill="#fff" text-anchor="middle" font-weight="700">PRESSURE</text>

        <text x="450" y="275" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">Transparency concerns raised over O&amp;M operator selection</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Geumsan County</span></div></div>
    <div class="fact"><div class="k">SCOPE</div><div class="v">Sewage <span class="b">O&amp;M</span></div></div>
    <div class="fact"><div class="k">VALUE</div><div class="v"><span class="b">32.5B KRW</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
