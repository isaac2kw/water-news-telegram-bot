<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Gyeongju City</span> Pushes <span class="b">Commercialization</span> of In-House Sewage Treatment Technology</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="110" width="170" height="90" fill="#E6F1FB" rx="10"/>
        <text x="125" y="145" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="700">R&amp;D</text>
        <text x="125" y="170" font-family="Helvetica" font-size="13" fill="#888780" text-anchor="middle">In-house Research</text>

        <polygon points="220,150 265,150 265,138 290,160 265,182 265,170 220,170" fill="#0075C1"/>

        <rect x="300" y="110" width="170" height="90" fill="#0075C1" rx="10"/>
        <text x="385" y="145" font-family="Helvetica" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PILOT</text>
        <text x="385" y="170" font-family="Helvetica" font-size="13" fill="#fff" text-anchor="middle">Verification</text>

        <polygon points="480,150 525,150 525,138 550,160 525,182 525,170 480,170" fill="#0075C1"/>

        <rect x="560" y="110" width="170" height="90" fill="#0075C1" rx="10"/>
        <text x="645" y="145" font-family="Helvetica" font-size="15" fill="#fff" text-anchor="middle" font-weight="700">PATENT</text>
        <text x="645" y="170" font-family="Helvetica" font-size="13" fill="#fff" text-anchor="middle">Transfer</text>

        <polygon points="740,150 785,150 785,138 810,160 785,182 785,170 740,170" fill="#DDA11D"/>

        <rect x="820" y="110" width="40" height="90" fill="#DDA11D" rx="6"/>
        <text x="840" y="105" font-family="Helvetica" font-size="13" fill="#DDA11D" text-anchor="middle" font-weight="700">GO</text>

        <text x="450" y="260" font-family="Helvetica" font-size="17" fill="#00205D" text-anchor="middle" font-weight="700">From municipal lab to market-ready technology</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Gyeongju City</span></div></div>
    <div class="fact"><div class="k">TECH</div><div class="v">Sewage Treatment</div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v"><span class="b">Commercialization</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
