<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE<span class="lbadge">US</span></div>
    <div class="ctitle"><span class="y">Casper</span> Council Approves <span class="b">$8.5M</span> Contracts for Wastewater Plant Projects</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="80" y="260" width="110" height="60" fill="#0075C1" rx="6"/>
        <text x="135" y="297" font-family="Helvetica" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">$1.5M</text>
        <text x="135" y="245" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle">Animal Shelter</text>

        <rect x="260" y="160" width="110" height="160" fill="#0075C1" rx="6"/>
        <text x="315" y="247" font-family="Helvetica" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">$4.2M</text>
        <text x="315" y="145" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle">WWTP Upgrade</text>

        <rect x="440" y="200" width="110" height="120" fill="#DDA11D" rx="6"/>
        <text x="495" y="267" font-family="Helvetica" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">$2.8M</text>
        <text x="495" y="185" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle">Plant Equipment</text>

        <line x1="80" y1="320" x2="580" y2="320" stroke="#B5D4F4" stroke-width="2"/>

        <rect x="630" y="140" width="210" height="150" fill="#E6F1FB" rx="12"/>
        <text x="735" y="180" font-family="Helvetica" font-size="16" fill="#888780" text-anchor="middle">TOTAL</text>
        <text x="735" y="235" font-family="Helvetica" font-size="42" font-weight="700" fill="#0075C1" text-anchor="middle">$8.5M</text>
        <text x="735" y="265" font-family="Helvetica" font-size="14" fill="#00205D" text-anchor="middle">City Council Approved</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Casper, WY</span></div></div>
    <div class="fact"><div class="k">SCOPE</div><div class="v">Shelter + <span class="b">WWTP</span></div></div>
    <div class="fact"><div class="k">BUDGET</div><div class="v"><span class="b">$8.5M</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
