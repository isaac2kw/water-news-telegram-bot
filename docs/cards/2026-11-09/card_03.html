<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET OUTLOOK<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle">Septic Tanker Truck Market to <span class="b">2035</span>: <span class="y">Municipal</span> Wastewater Upgrades Drive Growth</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="260" x2="860" y2="260" stroke="#B5D4F4" stroke-width="2"/>
        <line x1="80" y1="60" x2="80" y2="260" stroke="#B5D4F4" stroke-width="2"/>

        <polyline points="80,240 240,215 400,180 560,130 720,85 860,55" fill="none" stroke="#0075C1" stroke-width="4"/>

        <circle cx="80" cy="240" r="7" fill="#0075C1"/>
        <circle cx="240" cy="215" r="7" fill="#0075C1"/>
        <circle cx="400" cy="180" r="7" fill="#0075C1"/>
        <circle cx="560" cy="130" r="7" fill="#DDA11D"/>
        <circle cx="720" cy="85" r="7" fill="#DDA11D"/>
        <circle cx="860" cy="55" r="7" fill="#DDA11D"/>

        <text x="80" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2025</text>
        <text x="240" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2027</text>
        <text x="400" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2029</text>
        <text x="560" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2031</text>
        <text x="720" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2033</text>
        <text x="860" y="285" font-family="Helvetica" font-size="15" fill="#00205D" text-anchor="middle" font-weight="600">2035</text>

        <text x="470" y="40" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">Projected Market Growth Trajectory</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SEGMENT</div><div class="v">Septic Tanker Truck</div></div>
    <div class="fact"><div class="k">DRIVER</div><div class="v"><span class="b">Municipal</span> Upgrades</div></div>
    <div class="fact"><div class="k">HORIZON</div><div class="v"><span class="y">To 2035</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
