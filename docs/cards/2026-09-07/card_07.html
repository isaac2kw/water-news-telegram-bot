<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INDUSTRIAL REUSE<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Dow</span> Integrates <span class="b">Water Reuse</span> into <span class="y">Path2Zero</span> Plant Expansion</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="40" y="45" font-family="Helvetica" font-size="20" font-weight="700" fill="#888780">PROCESS FLOW</text>
        
        <rect x="40" y="90" width="180" height="120" rx="12" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="130" y="140" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D">Process</text>
        <text x="130" y="170" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D">Wastewater</text>

        <polygon points="235,150 275,130 275,170" fill="#0075C1"/>
        <rect x="275" y="145" width="20" height="10" fill="#0075C1"/>

        <rect x="310" y="90" width="180" height="120" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="400" y="140" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0075C1">Membrane</text>
        <text x="400" y="170" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0075C1">Treatment</text>

        <polygon points="505,150 545,130 545,170" fill="#0075C1"/>
        <rect x="545" y="145" width="20" height="10" fill="#0075C1"/>

        <rect x="580" y="90" width="180" height="120" rx="12" fill="#DDA11D" opacity="0.15" stroke="#DDA11D" stroke-width="2"/>
        <text x="670" y="140" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#DDA11D">Reuse in</text>
        <text x="670" y="170" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#DDA11D">Path2Zero</text>

        <polygon points="775,150 815,130 815,170" fill="#0075C1"/>
        <rect x="815" y="145" width="20" height="10" fill="#0075C1"/>
        <text x="855" y="155" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">♻</text>

        <text x="450" y="270" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#00205D">Closed-Loop Water Strategy for Petrochemical Expansion</text>
        <text x="450" y="295" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Case Study Reference</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Water Reuse</span></div></div>
    <div class="fact"><div class="k">OPERATOR</div><div class="v"><span class="y">Dow</span> Chemical</div></div>
    <div class="fact"><div class="k">PROJECT</div><div class="v"><span class="y">Path2Zero</span> Expansion</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
