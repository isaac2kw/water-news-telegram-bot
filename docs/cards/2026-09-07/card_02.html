<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_02">
  <div class="pad">
    <div class="label"><span class="ldot"></span>URBAN REGENERATION<span class="lbadge">KOREA</span></div>
    <div class="ctitle">28-Year Abandoned <span class="y">Seongnam Gumi-dong</span> Sewage Plant: Public Use Assessed</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <text x="40" y="50" font-family="Helvetica" font-size="20" fill="#888780" font-weight="700">TIMELINE</text>
        <line x1="40" y1="150" x2="860" y2="150" stroke="#B5D4F4" stroke-width="3"/>
        
        <circle cx="120" cy="150" r="14" fill="#00205D"/>
        <text x="120" y="115" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#00205D">1998</text>
        <text x="120" y="195" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">Plant Closed</text>

        <circle cx="380" cy="150" r="14" fill="#B5D4F4"/>
        <text x="380" y="115" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#888780">1998–2026</text>
        <text x="380" y="195" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">28 Years Abandoned</text>

        <circle cx="640" cy="150" r="14" fill="#0075C1"/>
        <text x="640" y="115" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#0075C1">2026</text>
        <text x="640" y="195" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#0075C1">Reopened</text>

        <circle cx="820" cy="150" r="14" fill="#DDA11D"/>
        <text x="820" y="115" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#DDA11D">NOW</text>
        <text x="820" y="195" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#DDA11D">Public Access</text>

        <text x="450" y="260" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#00205D">From Idle Infrastructure → Public Amenity</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Reuse of Assets</span></div></div>
    <div class="fact"><div class="k">DURATION</div><div class="v">28 Years Idle</div></div>
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Seongnam</span> Gumi-dong</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
