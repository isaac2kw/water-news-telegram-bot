<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;} .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY · FUNDING<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Lim Chang-yeol</span> Pushes <span class="y">Guri WWTP</span> Undergrounding — <span class="b">"Stable Funding Is Key"</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="80" width="200" height="140" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="160" y="130" font-size="20" fill="#00205D" text-anchor="middle" font-weight="700">Project</text>
        <text x="160" y="160" font-size="16" fill="#00205D" text-anchor="middle">Guri WWTP</text>
        <text x="160" y="185" font-size="16" fill="#00205D" text-anchor="middle">Undergrounding</text>
        <polygon points="270,140 320,140 320,125 355,150 320,175 320,160 270,160" fill="#0075C1"/>
        <rect x="360" y="80" width="200" height="140" rx="12" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="460" y="130" font-size="20" fill="#00205D" text-anchor="middle" font-weight="700">Key Hurdle</text>
        <text x="460" y="165" font-size="18" fill="#DDA11D" text-anchor="middle" font-weight="700">Stable Funding</text>
        <text x="460" y="190" font-size="14" fill="#888780" text-anchor="middle">Multi-year budget</text>
        <polygon points="570,140 620,140 620,125 655,150 620,175 620,160 570,160" fill="#0075C1"/>
        <rect x="660" y="80" width="200" height="140" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="760" y="130" font-size="20" fill="#00205D" text-anchor="middle" font-weight="700">Outcome</text>
        <text x="760" y="165" font-size="16" fill="#00205D" text-anchor="middle">Modern facility</text>
        <text x="760" y="190" font-size="16" fill="#00205D" text-anchor="middle">+ Urban land use</text>
        <text x="450" y="270" font-size="16" fill="#888780" text-anchor="middle">Financing plan is the decisive factor for undergrounding</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">DRIVER</div><div class="v"><span class="y">Lim Chang-yeol</span></div></div>
    <div class="fact"><div class="k">CHALLENGE</div><div class="v"><span class="b">Stable Funding</span></div></div>
    <div class="fact"><div class="k">SITE</div><div class="v"><span class="y">Guri</span> WWTP</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
