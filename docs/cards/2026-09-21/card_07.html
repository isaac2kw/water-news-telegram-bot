<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>CONTRACTS<span class="lbadge">US · CA</span></div>
    <div class="ctitle"><span class="y">AECOM</span> wins <span class="y">Silicon Valley</span> drinking water reuse design; <span class="y">Onterris</span> takes Canadian pipeline role</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="40" width="400" height="200" rx="14" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="240" y="80" text-anchor="middle" fill="#0075C1" font-size="22" font-weight="700">AECOM</text>
        <line x1="90" y1="100" x2="390" y2="100" stroke="#B5D4F4"/>
        <text x="240" y="135" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">SILICON VALLEY</text>
        <text x="240" y="165" text-anchor="middle" fill="#DDA11D" font-size="16" font-weight="700">DRINKING WATER REUSE</text>
        <text x="240" y="200" text-anchor="middle" fill="#888780" font-size="14">Design Contract</text>
        <text x="240" y="225" text-anchor="middle" fill="#888780" font-size="12">Potable Reuse System</text>

        <rect x="460" y="40" width="400" height="200" rx="14" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="660" y="80" text-anchor="middle" fill="#0075C1" font-size="22" font-weight="700">ONTERRIS</text>
        <line x1="510" y1="100" x2="810" y2="100" stroke="#B5D4F4"/>
        <text x="660" y="135" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">CANADA</text>
        <text x="660" y="165" text-anchor="middle" fill="#DDA11D" font-size="16" font-weight="700">GAS PIPELINE ROLE</text>
        <text x="660" y="200" text-anchor="middle" fill="#888780" font-size="14">Advisory Contract</text>
        <text x="660" y="225" text-anchor="middle" fill="#888780" font-size="12">Infrastructure Project</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">WINNER</div><div class="v"><span class="y">AECOM</span></div></div>
    <div class="fact"><div class="k">SCOPE</div><div class="v"><span class="b">Water Reuse Design</span></div></div>
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">Silicon Valley</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
