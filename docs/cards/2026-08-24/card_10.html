<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>CONFERENCE · WRAP-UP<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">KWWA</span> Concludes 2026 Water Industry Career Camp Successfully</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="230" width="140" height="30" fill="#B5D4F4"/>
        <text x="130" y="215" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D" font-weight="700">Recruitment</text>
        <text x="130" y="280" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#888780">Phase 1</text>
        <rect x="240" y="180" width="140" height="80" fill="#0075C1"/>
        <text x="310" y="165" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D" font-weight="700">Lectures</text>
        <text x="310" y="280" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#888780">Phase 2</text>
        <rect x="420" y="130" width="140" height="130" fill="#0075C1"/>
        <text x="490" y="115" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D" font-weight="700">Site Visits</text>
        <text x="490" y="280" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#888780">Phase 3</text>
        <rect x="600" y="80" width="140" height="180" fill="#DDA11D"/>
        <text x="670" y="65" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D" font-weight="700">Completion</text>
        <text x="670" y="280" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#888780">Phase 4</text>
        <line x1="40" y1="260" x2="860" y2="260" stroke="#00205D" stroke-width="2"/>
        <text x="670" y="180" text-anchor="middle" font-family="Helvetica" font-size="28" fill="#ffffff" font-weight="700">100%</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">EVENT</div><div class="v">Camp 2026</div></div>
    <div class="fact"><div class="k">ORGANIZER</div><div class="v"><span class="y">KWWA</span></div></div>
    <div class="fact"><div class="k">RESULT</div><div class="v"><span class="b">Success</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
