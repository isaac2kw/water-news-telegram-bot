<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>RESEARCH · FUNDING<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle">Funding Call: Bioavailability of Organic <span class="b">N &amp; P</span> in Wastewater</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="80" width="260" height="140" rx="16" fill="#E6F1FB"/>
        <text x="170" y="120" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#0075C1" font-weight="700">SOURCE</text>
        <text x="170" y="160" text-anchor="middle" font-family="Helvetica" font-size="22" fill="#00205D" font-weight="700">Wastewater</text>
        <text x="170" y="190" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">Organic N · P</text>
        <polygon points="310,140 360,125 360,140 400,140 400,160 360,160 360,175" fill="#0075C1"/>
        <rect x="410" y="80" width="200" height="140" rx="16" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="510" y="120" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#00205D" font-weight="700">RESEARCH</text>
        <circle cx="465" cy="165" r="18" fill="#0075C1"/>
        <text x="465" y="171" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff" font-weight="700">N</text>
        <circle cx="555" cy="165" r="18" fill="#DDA11D"/>
        <text x="555" y="171" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff" font-weight="700">P</text>
        <polygon points="620,140 670,125 670,140 710,140 710,160 670,160 670,175" fill="#0075C1"/>
        <rect x="720" y="80" width="140" height="140" rx="16" fill="#DDA11D"/>
        <text x="790" y="130" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#ffffff" font-weight="700">FUNDING</text>
        <text x="790" y="160" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#ffffff" font-weight="700">GRANT</text>
        <text x="790" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Opportunity</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">TOPIC</div><div class="v">Bioavailability</div></div>
    <div class="fact"><div class="k">NUTRIENTS</div><div class="v"><span class="b">Organic N &amp; P</span></div></div>
    <div class="fact"><div class="k">TYPE</div><div class="v">Research <span class="y">Grant</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
