<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MBR · CONTRACT WIN<span class="lbadge">AUSTRALIA</span></div>
    <div class="ctitle"><span class="y">DuPont</span> Wins Major Australian Wastewater Upgrade with <span class="y">MemCor MBR</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="70" width="240" height="160" rx="16" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="160" y="115" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#DDA11D" font-weight="700">DuPont</text>
        <text x="160" y="145" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Water Solutions</text>
        <text x="160" y="185" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#0075C1" font-weight="700">MemCor MBR</text>
        <polygon points="290,145 340,130 340,145 400,145 400,160 340,160 340,175" fill="#0075C1"/>
        <rect x="410" y="70" width="200" height="160" rx="16" fill="#F5F7FA"/>
        <text x="510" y="115" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">MBR SYSTEM</text>
        <rect x="435" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="455" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="475" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="495" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="515" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="535" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="555" y="135" width="12" height="70" fill="#0075C1"/>
        <rect x="575" y="135" width="12" height="70" fill="#0075C1"/>
        <polygon points="620,145 670,130 670,145 710,145 710,160 670,160 670,175" fill="#0075C1"/>
        <rect x="720" y="70" width="140" height="160" rx="16" fill="#DDA11D"/>
        <text x="790" y="130" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#ffffff" font-weight="700">AUSTRALIA</text>
        <text x="790" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">WWTP</text>
        <text x="790" y="185" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Upgrade</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SUPPLIER</div><div class="v"><span class="y">DuPont</span></div></div>
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">MemCor MBR</span></div></div>
    <div class="fact"><div class="k">MARKET</div><div class="v"><span class="y">Australia</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
