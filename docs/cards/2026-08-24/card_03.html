<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>EDUCATION · WATER TALENT<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">KWWA</span> Job Camp: 57 Students from 23 Universities Complete Program</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="70" width="240" height="180" rx="16" fill="#E6F1FB"/>
        <text x="160" y="120" text-anchor="middle" font-family="Helvetica" font-size="22" fill="#0075C1" font-weight="700">23</text>
        <text x="160" y="150" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">Universities</text>
        <circle cx="160" cy="200" r="30" fill="#0075C1"/>
        <text x="160" y="207" text-anchor="middle" font-family="Helvetica" font-size="18" fill="#ffffff" font-weight="700">UNI</text>
        <polygon points="290,155 340,140 340,150 400,150 400,160 340,160 340,170" fill="#B5D4F4"/>
        <rect x="410" y="70" width="240" height="180" rx="16" fill="#DDA11D" opacity="0.15"/>
        <text x="530" y="130" text-anchor="middle" font-family="Helvetica" font-size="52" fill="#DDA11D" font-weight="700">57</text>
        <text x="530" y="165" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Students</text>
        <text x="530" y="200" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">100% Completed</text>
        <polygon points="660,155 710,140 710,150 770,150 770,160 710,160 710,170" fill="#B5D4F4"/>
        <rect x="780" y="70" width="80" height="180" rx="16" fill="#0075C1"/>
        <text x="820" y="140" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff" font-weight="700">WATER</text>
        <text x="820" y="165" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff" font-weight="700">INDUSTRY</text>
        <text x="820" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff" font-weight="700">CAREER</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">HOST</div><div class="v"><span class="y">KWWA</span></div></div>
    <div class="fact"><div class="k">PARTICIPANTS</div><div class="v"><span class="b">57</span> Students</div></div>
    <div class="fact"><div class="k">REACH</div><div class="v"><span class="b">23</span> Universities</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
