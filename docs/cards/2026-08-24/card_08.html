<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>WATER REUSE · POLICY<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Uiwang</span> Council Studies Expansion of Rainwater &amp; Reclaimed Water Reuse</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="70" width="180" height="80" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="130" y="105" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Rainwater</text>
        <text x="130" y="130" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Harvested</text>
        <rect x="40" y="170" width="180" height="80" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="130" y="205" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Greywater</text>
        <text x="130" y="230" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Mid-water</text>
        <polygon points="230,105 280,90 280,105 340,105 340,120 280,120 280,135" fill="#0075C1"/>
        <polygon points="230,205 280,190 280,205 340,205 340,220 280,220 280,235" fill="#0075C1"/>
        <rect x="350" y="115" width="160" height="90" rx="14" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="430" y="150" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Treated</text>
        <text x="430" y="180" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#0075C1">Sewage Effluent</text>
        <polygon points="520,155 570,140 570,155 620,155 620,170 570,170 570,185" fill="#DDA11D"/>
        <rect x="630" y="90" width="220" height="140" rx="14" fill="#DDA11D"/>
        <text x="740" y="140" text-anchor="middle" font-family="Helvetica" font-size="20" fill="#ffffff" font-weight="700">REUSE</text>
        <text x="740" y="175" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Cities · Industry</text>
        <text x="740" y="200" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Irrigation · Utility</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Uiwang</span>, Gyeonggi</div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">Water <span class="b">Reuse</span></div></div>
    <div class="fact"><div class="k">SOURCES</div><div class="v">Rain · Grey · Reclaimed</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
