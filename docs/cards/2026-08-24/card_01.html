<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY · AIR QUALITY<span class="lbadge">USA</span></div>
    <div class="ctitle">Air Pollution Upgrades Approved for <span class="y">Post Point</span> Wastewater Plant</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="120" width="200" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="140" y="165" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D">WWTP</text>
        <text x="140" y="195" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#0075C1">Post Point</text>
        <polygon points="260,175 320,160 320,170 400,170 400,180 320,180 320,190" fill="#0075C1"/>
        <rect x="420" y="90" width="200" height="80" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="520" y="120" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Emission Controls</text>
        <text x="520" y="145" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Air Scrubbers · Filters</text>
        <rect x="420" y="190" width="200" height="80" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="520" y="220" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#00205D" font-weight="700">Permit Approval</text>
        <text x="520" y="245" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Regulatory Sign-off</text>
        <polygon points="640,130 700,130 700,120 760,140 700,160 700,150 640,150" fill="#DDA11D"/>
        <rect x="760" y="110" width="100" height="100" rx="14" fill="#DDA11D"/>
        <text x="810" y="150" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="700" fill="#ffffff">CLEANER</text>
        <text x="810" y="175" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="700" fill="#ffffff">AIR</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Bellingham</span>, WA</div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">Air <span class="b">Pollution</span> Upgrade</div></div>
    <div class="fact"><div class="k">STATUS</div><div class="v"><span class="b">Approved</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
