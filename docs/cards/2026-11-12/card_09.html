<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.3;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>AI · R&D<span class="lbadge">KR</span></div>
    <div class="ctitle"><span class="y">Incheon Environment Corp.</span> Highlights <span class="b">AI-based</span> Sewage Treatment Research Results</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="110" width="160" height="100" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="120" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Sensor</text>
        <text x="120" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Data</text>

        <polygon points="200,150 250,150 250,140 275,160 250,180 250,170 200,170" fill="#0075C1"/>

        <rect x="285" y="110" width="160" height="100" rx="12" fill="#DDA11D"/>
        <text x="365" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">AI Model</text>
        <text x="365" y="178" text-anchor="middle" font-size="14" fill="#fff">Analysis</text>

        <polygon points="445,150 495,150 495,140 520,160 495,180 495,170 445,170" fill="#0075C1"/>

        <rect x="530" y="110" width="160" height="100" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="610" y="150" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Process</text>
        <text x="610" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Control</text>

        <polygon points="690,150 740,150 740,140 765,160 740,180 740,170 690,170" fill="#0075C1"/>

        <rect x="775" y="110" width="100" height="100" rx="12" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="825" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#DDA11D">Better</text>
        <text x="825" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#DDA11D">Quality</text>
        <text x="825" y="195" text-anchor="middle" font-size="12" fill="#00205D">+ efficiency</text>

        <text x="450" y="270" text-anchor="middle" font-size="18" font-weight="700" fill="#0075C1">AI-driven Sewage Treatment Pipeline</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">ORG</div><div class="v"><span class="y">Incheon Env. Corp.</span></div></div>
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">AI</span> analytics</div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">Sewage & quality</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
