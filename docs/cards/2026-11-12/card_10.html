<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:48px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.3;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>OPERATIONS · HANDOVER<span class="lbadge">US</span></div>
    <div class="ctitle"><span class="y">Veolia</span> Returns to <span class="y">Rhode Island</span> Wastewater Plant After Complaints Under <span class="y">Jacobs</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="60" width="200" height="90" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="140" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#0075C1">Veolia</text>
        <text x="140" y="120" text-anchor="middle" font-size="14" fill="#00205D">Previous operator</text>

        <polygon points="240,100 290,100 290,90 320,110 290,130 290,120 240,120" fill="#0075C1"/>

        <rect x="330" y="60" width="200" height="90" rx="12" fill="#F5F7FA" stroke="#DDA11D" stroke-width="2"/>
        <text x="430" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#DDA11D">Jacobs</text>
        <text x="430" y="120" text-anchor="middle" font-size="14" fill="#00205D">Complaints raised</text>

        <polygon points="530,100 580,100 580,90 610,110 580,130 580,120 530,120" fill="#0075C1"/>

        <rect x="620" y="60" width="220" height="90" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="730" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#0075C1">Veolia Returns</text>
        <text x="730" y="120" text-anchor="middle" font-size="14" fill="#00205D">Resumes operations</text>

        <rect x="200" y="200" width="480" height="90" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="440" y="235" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Rhode Island</text>
        <text x="440" y="265" text-anchor="middle" font-size="16" fill="#888780">Wastewater Treatment Plant</text>

        <line x1="140" y1="150" x2="300" y2="200" stroke="#B5D4F4" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="430" y1="150" x2="440" y2="200" stroke="#B5D4F4" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="730" y1="150" x2="580" y2="200" stroke="#B5D4F4" stroke-width="2" stroke-dasharray="4,4"/>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Rhode Island</span></div></div>
    <div class="fact"><div class="k">NEW OP</div><div class="v"><span class="y">Veolia</span> returns</div></div>
    <div class="fact"><div class="k">PRIOR OP</div><div class="v"><span class="y">Jacobs</span> (complaints)</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
