<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>FUNDING<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Elizabethtown</span> awarded over <span class="b">$20M in grants</span> for wastewater treatment project</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="260" x2="860" y2="260" stroke="#00205D" stroke-width="2"/>
        <line x1="80" y1="40" x2="80" y2="260" stroke="#00205D" stroke-width="2"/>

        <text x="60" y="60" text-anchor="end" fill="#888780" font-size="14" font-family="Helvetica">$25M</text>
        <text x="60" y="150" text-anchor="end" fill="#888780" font-size="14" font-family="Helvetica">$15M</text>
        <text x="60" y="230" text-anchor="end" fill="#888780" font-size="14" font-family="Helvetica">$5M</text>

        <rect x="300" y="60" width="200" height="200" fill="#DDA11D"/>
        <text x="400" y="160" text-anchor="middle" fill="#ffffff" font-size="60" font-weight="700" font-family="Helvetica">$20M+</text>
        <text x="400" y="200" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="2" font-family="Helvetica">GRANTS AWARDED</text>
        <text x="400" y="285" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700" font-family="Helvetica">ELIZABETHTOWN WWT PROJECT</text>

        <rect x="600" y="140" width="150" height="120" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="675" y="185" text-anchor="middle" fill="#0075C1" font-size="22" font-weight="700" font-family="Helvetica">GRANT</text>
        <text x="675" y="215" text-anchor="middle" fill="#00205D" font-size="14" font-weight="600" font-family="Helvetica">Non-repayable</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Elizabethtown</span></div></div>
    <div class="fact"><div class="k">AMOUNT</div><div class="v"><span class="b">$20M+</span> grants</div></div>
    <div class="fact"><div class="k">PURPOSE</div><div class="v">WWT project</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
