<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>PROJECT<span class="lbadge">BRAZIL</span></div>
    <div class="ctitle"><span class="y">Veolia</span> to supply wastewater treatment for <span class="y">Arauco</span>'s <span class="y">Sucuriú</span> pulp mill</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="60" width="780" height="200" rx="16" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="100" y="110" fill="#0075C1" font-size="20" font-weight="700" letter-spacing="3" font-family="Helvetica">PROJECT: SUCURIÚ PULP MILL</text>
        <line x1="100" y1="125" x2="500" y2="125" stroke="#0075C1" stroke-width="2"/>

        <circle cx="130" cy="170" r="8" fill="#DDA11D"/>
        <text x="155" y="177" fill="#00205D" font-size="18" font-weight="700" font-family="Helvetica">Operator:</text>
        <text x="260" y="177" fill="#DDA11D" font-size="18" font-weight="700" font-family="Helvetica">Arauco</text>

        <circle cx="130" cy="210" r="8" fill="#DDA11D"/>
        <text x="155" y="217" fill="#00205D" font-size="18" font-weight="700" font-family="Helvetica">Scope:</text>
        <text x="235" y="217" fill="#0075C1" font-size="18" font-weight="700" font-family="Helvetica">Wastewater Treatment Supply</text>

        <rect x="560" y="140" width="240" height="90" rx="12" fill="#0075C1"/>
        <text x="680" y="175" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" font-family="Helvetica">VEOLIA</text>
        <text x="680" y="205" text-anchor="middle" fill="#E6F1FB" font-size="14" font-weight="600" letter-spacing="2" font-family="Helvetica">EPC PARTNER</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SITE</div><div class="v"><span class="y">Sucuriú</span> mill</div></div>
    <div class="fact"><div class="k">OWNER</div><div class="v"><span class="y">Arauco</span></div></div>
    <div class="fact"><div class="k">SUPPLIER</div><div class="v"><span class="y">Veolia</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
