<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Wausau</span>'s lead pipe award mostly loans · <span class="b">PFAS</span> settlement cash still has no plan</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="60" width="380" height="200" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="80" y="100" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2" font-family="Helvetica">LEAD PIPE AWARD</text>
        <rect x="80" y="120" width="260" height="36" fill="#0075C1"/>
        <text x="90" y="145" fill="#ffffff" font-size="18" font-weight="700" font-family="Helvetica">LOANS (MAJORITY)</text>
        <rect x="80" y="170" width="90" height="36" fill="#DDA11D"/>
        <text x="90" y="195" fill="#ffffff" font-size="18" font-weight="700" font-family="Helvetica">GRANT</text>
        <text x="80" y="240" fill="#00205D" font-size="18" font-weight="600" font-family="Helvetica">Repayment burden on city</text>

        <rect x="460" y="60" width="380" height="200" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="480" y="100" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2" font-family="Helvetica">PFAS SETTLEMENT CASH</text>
        <circle cx="560" cy="170" r="50" fill="#E6F1FB" stroke="#DDA11D" stroke-width="4"/>
        <text x="560" y="178" text-anchor="middle" fill="#DDA11D" font-size="26" font-weight="700" font-family="Helvetica">?</text>
        <text x="640" y="160" fill="#00205D" font-size="18" font-weight="700" font-family="Helvetica">NO PLAN YET</text>
        <text x="640" y="185" fill="#888780" font-size="16" font-family="Helvetica">Allocation pending</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Wausau</span>, Wisconsin</div></div>
    <div class="fact"><div class="k">FUNDING</div><div class="v">Mostly <span class="b">loans</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v"><span class="y">PFAS</span> cash unplanned</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
