<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>ENFORCEMENT<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Miryang</span> City fined for effluent <span class="b">exceeding discharge standards</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="200" x2="820" y2="200" stroke="#0075C1" stroke-width="3" stroke-dasharray="10,6"/>
        <text x="830" y="195" fill="#0075C1" font-size="16" font-weight="700" font-family="Helvetica">LIMIT</text>

        <rect x="140" y="160" width="100" height="40" fill="#B5D4F4"/>
        <text x="190" y="235" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700" font-family="Helvetica">Standard</text>

        <rect x="300" y="170" width="100" height="30" fill="#B5D4F4"/>
        <text x="350" y="235" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700" font-family="Helvetica">Compliant</text>

        <rect x="460" y="80" width="100" height="120" fill="#DDA11D"/>
        <text x="510" y="235" text-anchor="middle" fill="#DDA11D" font-size="16" font-weight="700" font-family="Helvetica">MIRYANG</text>
        <text x="510" y="70" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700" font-family="Helvetica">EXCEEDED</text>

        <rect x="620" y="150" width="100" height="50" fill="#B5D4F4"/>
        <text x="670" y="235" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700" font-family="Helvetica">Average</text>

        <text x="450" y="290" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700" letter-spacing="2" font-family="Helvetica">RESULT: ADMINISTRATIVE FINE IMPOSED</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Miryang</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v">Effluent <span class="b">over limit</span></div></div>
    <div class="fact"><div class="k">ACTION</div><div class="v">Fine imposed</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
