<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>LITIGATION · PFAS<span class="lbadge">US</span></div>
    <div class="ctitle"><span class="y">Veolia</span> Sues 9 Companies Over <span class="b">PFAS</span> in <span class="y">Delaware</span> Drinking Water</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="120" width="220" height="100" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="140" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">Veolia</text>
        <text x="140" y="190" text-anchor="middle" font-size="16" fill="#888780">Water Supplier</text>
        <polygon points="270,155 340,155 340,145 380,170 340,195 340,185 270,185" fill="#0075C1"/>
        <text x="325" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#DDA11D">LAWSUIT</text>
        <rect x="400" y="60" width="470" height="220" rx="12" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="635" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">9 Defendant Manufacturers</text>
        <circle cx="450" cy="140" r="18" fill="#DDA11D"/><text x="450" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
        <circle cx="510" cy="140" r="18" fill="#DDA11D"/><text x="510" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
        <circle cx="570" cy="140" r="18" fill="#DDA11D"/><text x="570" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
        <circle cx="630" cy="140" r="18" fill="#DDA11D"/><text x="630" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
        <circle cx="690" cy="140" r="18" fill="#DDA11D"/><text x="690" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
        <circle cx="480" cy="200" r="18" fill="#DDA11D"/><text x="480" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
        <circle cx="540" cy="200" r="18" fill="#DDA11D"/><text x="540" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">7</text>
        <circle cx="600" cy="200" r="18" fill="#DDA11D"/><text x="600" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">8</text>
        <circle cx="660" cy="200" r="18" fill="#DDA11D"/><text x="660" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">9</text>
        <text x="635" y="255" text-anchor="middle" font-size="16" fill="#888780">Alleged PFAS Contamination Sources</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">PLAINTIFF</div><div class="v"><span class="y">Veolia</span></div></div>
    <div class="fact"><div class="k">DEFENDANTS</div><div class="v"><span class="b">9 Companies</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v">PFAS Contamination</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
