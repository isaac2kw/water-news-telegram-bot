<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>PRIVATE EQUITY · DEAL<span class="lbadge">US</span></div>
    <div class="ctitle"><span class="y">Astara Capital</span> Snaps Up <span class="b">Industrial Wastewater</span> Firm <span class="y">Dynatec</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="60" width="780" height="220" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="450" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">Private Equity Deal Snapshot</text>
        <circle cx="200" cy="180" r="55" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="200" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Astara</text>
        <text x="200" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Capital</text>
        <text x="200" y="255" text-anchor="middle" font-size="15" fill="#888780">PE Investor</text>
        <polygon points="285,175 380,175 380,160 440,185 380,210 380,195 285,195" fill="#DDA11D"/>
        <text x="362" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#0075C1">BUYOUT</text>
        <circle cx="530" cy="180" r="55" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="530" y="187" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Dynatec</text>
        <text x="530" y="255" text-anchor="middle" font-size="15" fill="#888780">Target Firm</text>
        <rect x="620" y="145" width="200" height="70" rx="10" fill="#0075C1"/>
        <text x="720" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Industrial</text>
        <text x="720" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Wastewater</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">BUYER</div><div class="v"><span class="y">Astara Capital</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v"><span class="y">Dynatec</span></div></div>
    <div class="fact"><div class="k">TYPE</div><div class="v"><span class="b">PE Buyout</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
