<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>OVERSIGHT · POLLUTION<span class="lbadge">KR</span></div>
    <div class="ctitle">Councilor <span class="y">Lee Sang-hyun</span> Inspects <span class="y">Sannae Daejeong</span> WWTP: <span class="b">Ramcheon</span> Pollution Must End</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="70" width="820" height="200" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="450" y="115" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">On-Site Inspection Overview</text>
        <circle cx="180" cy="200" r="45" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="180" y="205" text-anchor="middle" font-size="15" font-weight="700" fill="#00205D">Councilor</text>
        <text x="180" y="260" text-anchor="middle" font-size="14" fill="#888780">Oversight</text>
        <polygon points="240,195 320,195 320,180 360,205 320,230 320,215 240,215" fill="#0075C1"/>
        <rect x="380" y="165" width="180" height="80" rx="10" fill="#DDA11D"/>
        <text x="470" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Sannae Daejeong</text>
        <text x="470" y="225" text-anchor="middle" font-size="15" fill="#fff">WWTP Facility</text>
        <polygon points="580,195 660,195 660,180 700,205 660,230 660,215 580,215" fill="#0075C1"/>
        <circle cx="770" cy="200" r="55" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="770" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Ramcheon</text>
        <text x="770" y="220" text-anchor="middle" font-size="14" fill="#888780">Receiving Stream</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">OFFICIAL</div><div class="v"><span class="y">Lee Sang-hyun</span></div></div>
    <div class="fact"><div class="k">SITE</div><div class="v"><span class="y">Sannae Daejeong</span> WWTP</div></div>
    <div class="fact"><div class="k">CONCERN</div><div class="v"><span class="b">Ramcheon Pollution</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
