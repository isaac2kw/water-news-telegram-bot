<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>PROCUREMENT<span class="lbadge">KOREA</span></div>
    <div class="ctitle">[Exclusive] <span class="y">Yeongam County</span> WWTP bid rigging suspicions surface</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="60" width="220" height="90" rx="10" fill="#E6F1FB"/>
        <text x="150" y="95" text-anchor="middle" font-size="16" fill="#0075C1" font-weight="700" letter-spacing="1">TENDER ISSUED</text>
        <text x="150" y="125" text-anchor="middle" font-size="14" fill="#888780">official bid opens</text>
        <polygon points="270,105 320,90 320,120" fill="#B5D4F4"/>
        <rect x="330" y="60" width="240" height="90" rx="10" fill="#DDA11D"/>
        <text x="450" y="95" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700" letter-spacing="1">"PRE-SELECTED?"</text>
        <text x="450" y="125" text-anchor="middle" font-size="14" fill="#ffffff">suspected favoritism</text>
        <polygon points="580,105 630,90 630,120" fill="#B5D4F4"/>
        <rect x="640" y="60" width="220" height="90" rx="10" fill="#00205D"/>
        <text x="750" y="95" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="700" letter-spacing="1">CONTRACT AWARD</text>
        <text x="750" y="125" text-anchor="middle" font-size="14" fill="#ffffff">investigation raised</text>
        <rect x="40" y="200" width="820" height="60" rx="10" fill="#F5F7FA"/>
        <text x="450" y="238" text-anchor="middle" font-size="20" fill="#00205D" font-weight="700">Transparency & fair bidding at stake</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">Yeongam County</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v">Bid rigging suspicion</div></div>
    <div class="fact"><div class="k">STATUS</div><div class="v"><span class="b">Under scrutiny</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
