<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_04">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY<span class="lbadge">PFAS</span></div>
    <div class="ctitle">New <span class="b">membrane</span> disarms <span class="y">PFAS</span>, reports <span class="y">C&amp;EN</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="80" width="180" height="160" rx="12" fill="#E6F1FB"/>
        <text x="130" y="140" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Contaminated</text>
        <text x="130" y="170" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Water</text>
        <circle cx="90" cy="200" r="7" fill="#DDA11D"/>
        <circle cx="120" cy="210" r="6" fill="#DDA11D"/>
        <circle cx="150" cy="200" r="7" fill="#DDA11D"/>
        <circle cx="175" cy="212" r="5" fill="#DDA11D"/>

        <polygon points="235,160 290,140 290,180" fill="#0075C1"/>

        <rect x="310" y="60" width="140" height="200" rx="10" fill="#0075C1"/>
        <text x="380" y="160" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">New</text>
        <text x="380" y="190" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Membrane</text>
        <line x1="340" y1="80" x2="340" y2="240" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="420" y1="80" x2="420" y2="240" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>

        <polygon points="465,160 520,140 520,180" fill="#0075C1"/>

        <rect x="540" y="80" width="320" height="160" rx="12" fill="#DDA11D"/>
        <text x="700" y="140" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">PFAS Disarmed</text>
        <text x="700" y="180" text-anchor="middle" fill="#fff" font-size="18">Clean Water Output</text>
        <text x="700" y="215" text-anchor="middle" fill="#fff" font-size="16">Reactive degradation</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Membrane Tech</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v"><span class="y">PFAS</span> Removal</div></div>
    <div class="fact"><div class="k">SOURCE</div><div class="v"><span class="y">C&amp;EN</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
