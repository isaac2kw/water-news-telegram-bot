<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>BUSINESS<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle"><span class="y">Morui</span> expands global <span class="b">turnkey solutions</span> for desalination &amp; RO</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <circle cx="450" cy="160" r="90" fill="#DDA11D"/>
        <text x="450" y="155" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">Morui</text>
        <text x="450" y="185" text-anchor="middle" fill="#fff" font-size="16">Turnkey</text>

        <rect x="40" y="40" width="220" height="80" rx="12" fill="#E6F1FB"/>
        <text x="150" y="75" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Desalination</text>
        <text x="150" y="100" text-anchor="middle" fill="#888780" font-size="14">Seawater plants</text>
        <line x1="260" y1="100" x2="365" y2="140" stroke="#0075C1" stroke-width="3"/>

        <rect x="640" y="40" width="220" height="80" rx="12" fill="#E6F1FB"/>
        <text x="750" y="75" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Reverse Osmosis</text>
        <text x="750" y="100" text-anchor="middle" fill="#888780" font-size="14">Membrane systems</text>
        <line x1="640" y1="100" x2="535" y2="140" stroke="#0075C1" stroke-width="3"/>

        <rect x="40" y="220" width="220" height="80" rx="12" fill="#E6F1FB"/>
        <text x="150" y="255" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Industrial WW</text>
        <text x="150" y="280" text-anchor="middle" fill="#888780" font-size="14">Process water</text>
        <line x1="260" y1="240" x2="365" y2="190" stroke="#0075C1" stroke-width="3"/>

        <rect x="640" y="220" width="220" height="80" rx="12" fill="#E6F1FB"/>
        <text x="750" y="255" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Global Markets</text>
        <text x="750" y="280" text-anchor="middle" fill="#888780" font-size="14">Export expansion</text>
        <line x1="640" y1="240" x2="535" y2="190" stroke="#0075C1" stroke-width="3"/>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Business</span></div></div>
    <div class="fact"><div class="k">COMPANY</div><div class="v"><span class="y">Morui</span></div></div>
    <div class="fact"><div class="k">SCOPE</div><div class="v">Desal, RO, Industrial</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
