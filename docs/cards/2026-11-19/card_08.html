<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:48px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>PARTNERSHIP<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">EcoWater Forum</span> and <span class="y">Busan Environment Corp.</span> Host <span class="b">Joint Tech Forum</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="90" width="260" height="130" rx="16" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="170" y="140" text-anchor="middle" fill="#DDA11D" font-size="22" font-weight="700">EcoWater</text>
        <text x="170" y="170" text-anchor="middle" fill="#DDA11D" font-size="22" font-weight="700">Forum</text>
        <text x="170" y="200" text-anchor="middle" fill="#888780" font-size="14">Industry Network</text>
        <circle cx="450" cy="155" r="55" fill="#E6F1FB" stroke="#0075C1" stroke-width="3"/>
        <text x="450" y="150" text-anchor="middle" fill="#0075C1" font-size="16" font-weight="700">JOINT</text>
        <text x="450" y="175" text-anchor="middle" fill="#0075C1" font-size="16" font-weight="700">FORUM</text>
        <line x1="300" y1="155" x2="395" y2="155" stroke="#0075C1" stroke-width="3"/>
        <line x1="505" y1="155" x2="600" y2="155" stroke="#0075C1" stroke-width="3"/>
        <rect x="600" y="90" width="260" height="130" rx="16" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="730" y="140" text-anchor="middle" fill="#DDA11D" font-size="22" font-weight="700">Busan</text>
        <text x="730" y="170" text-anchor="middle" fill="#DDA11D" font-size="22" font-weight="700">Env. Corp.</text>
        <text x="730" y="200" text-anchor="middle" fill="#888780" font-size="14">Public Operator</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">HOSTS</div><div class="v"><span class="y">EcoWater</span> · <span class="y">Busan</span></div></div>
    <div class="fact"><div class="k">TOPIC</div><div class="v">WWTP best practices</div></div>
    <div class="fact"><div class="k">FORMAT</div><div class="v"><span class="b">Tech exchange</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
