<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 20px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Cheongju</span> Sewage Facilities Evolve Into <span class="b">Energy and Water</span> Producing Assets</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <line x1="60" y1="260" x2="860" y2="260" stroke="#B5D4F4" stroke-width="2"/>
        <circle cx="180" cy="260" r="12" fill="#B5D4F4"/>
        <text x="180" y="295" text-anchor="middle" fill="#888780" font-size="16">Past</text>
        <text x="180" y="230" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">Treatment</text>
        <text x="180" y="210" text-anchor="middle" fill="#888780" font-size="14">only</text>
        <circle cx="450" cy="260" r="14" fill="#0075C1"/>
        <text x="450" y="295" text-anchor="middle" fill="#888780" font-size="16">Present</text>
        <text x="450" y="230" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700">Transition</text>
        <text x="450" y="210" text-anchor="middle" fill="#888780" font-size="14">upgrade</text>
        <circle cx="740" cy="260" r="16" fill="#DDA11D"/>
        <text x="740" y="295" text-anchor="middle" fill="#888780" font-size="16">Future</text>
        <text x="740" y="230" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">Energy + Water</text>
        <text x="740" y="210" text-anchor="middle" fill="#888780" font-size="14">producer</text>
        <rect x="100" y="40" width="160" height="60" rx="10" fill="#F5F7FA"/>
        <text x="180" y="78" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">Cost Center</text>
        <rect x="370" y="40" width="160" height="60" rx="10" fill="#E6F1FB"/>
        <text x="450" y="78" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700">Upgrade</text>
        <rect x="660" y="40" width="160" height="60" rx="10" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="740" y="78" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">Asset</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Cheongju</span></div></div>
    <div class="fact"><div class="k">SHIFT</div><div class="v">Cost → Asset</div></div>
    <div class="fact"><div class="k">OUTPUTS</div><div class="v"><span class="b">Energy · Water</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
