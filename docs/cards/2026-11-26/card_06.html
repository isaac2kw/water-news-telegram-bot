<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>WASTEWATER<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Gokseong</span> Improves Domestic <span class="b">Sewage System</span> in <span class="y">Samgi</span> &amp; <span class="y">Gyeommyeon</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="100" width="170" height="120" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="115" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Households</text>
        <text x="115" y="180" text-anchor="middle" fill="#0075C1" font-size="15">Domestic Flow</text>
        <polygon points="200,160 260,150 260,170" fill="#0075C1"/>
        <rect x="270" y="100" width="170" height="120" rx="12" fill="#F5F7FA" stroke="#00205D" stroke-width="2"/>
        <text x="355" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Collection</text>
        <text x="355" y="180" text-anchor="middle" fill="#0075C1" font-size="15">Sewer Network</text>
        <polygon points="440,160 500,150 500,170" fill="#DDA11D"/>
        <rect x="510" y="100" width="170" height="120" rx="12" fill="#DDA11D"/>
        <text x="595" y="150" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Treatment</text>
        <text x="595" y="180" text-anchor="middle" fill="#fff" font-size="15">Integrated WWTP</text>
        <polygon points="680,160 740,150 740,170" fill="#0075C1"/>
        <rect x="750" y="100" width="130" height="120" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="815" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">River</text>
        <text x="815" y="180" text-anchor="middle" fill="#0075C1" font-size="15">Discharge</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">GOAL</div><div class="v"><span class="b">System Upgrade</span></div></div>
    <div class="fact"><div class="k">SCOPE</div><div class="v">Domestic Sewage</div></div>
    <div class="fact"><div class="k">AREAS</div><div class="v"><span class="y">Samgi · Gyeommyeon</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
