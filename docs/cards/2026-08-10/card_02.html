<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_02">
  <div class="pad">
    <div class="label"><span class="ldot"></span>DROUGHT · REUSE<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Gimhae</span> Turns to Reclaimed Wastewater for Farming Amid Drought</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="110" width="180" height="110" rx="12" fill="#E6F1FB"/>
        <text x="120" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Drought</text>
        <text x="120" y="180" text-anchor="middle" fill="#0075C1" font-size="16">Alert Level</text>
        <polygon points="215,165 250,145 250,155 275,155 275,175 250,175 250,185" fill="#0075C1"/>
        <rect x="285" y="110" width="180" height="110" rx="12" fill="#E6F1FB"/>
        <text x="375" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">WWTP</text>
        <text x="375" y="180" text-anchor="middle" fill="#0075C1" font-size="16">Reclaimed Water</text>
        <polygon points="470,165 505,145 505,155 530,155 530,175 505,175 505,185" fill="#0075C1"/>
        <rect x="540" y="110" width="180" height="110" rx="12" fill="#E6F1FB"/>
        <text x="630" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Temp. Weir</text>
        <text x="630" y="180" text-anchor="middle" fill="#0075C1" font-size="16">Storage</text>
        <polygon points="725,165 760,145 760,155 785,155 785,175 760,175 760,185" fill="#DDA11D"/>
        <rect x="795" y="110" width="90" height="110" rx="12" fill="#DDA11D"/>
        <text x="840" y="155" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Farm</text>
        <text x="840" y="180" text-anchor="middle" fill="#ffffff" font-size="14">Irrigation</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">Gimhae</span>, Korea</div></div>
    <div class="fact"><div class="k">ACTION</div><div class="v"><span class="b">Wastewater Reuse</span></div></div>
    <div class="fact"><div class="k">PURPOSE</div><div class="v">Agricultural Water</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
