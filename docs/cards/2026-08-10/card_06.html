<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:54px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET REPORT<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">South Korea</span>'s <span class="b">Membrane</span> Water & Wastewater Treatment Market</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="270" x2="860" y2="270" stroke="#B5D4F4" stroke-width="2"/>
        <rect x="130" y="200" width="90" height="70" fill="#0075C1"/>
        <text x="175" y="290" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">MF</text>
        <text x="175" y="190" text-anchor="middle" fill="#0075C1" font-size="14">Microfiltration</text>
        <rect x="270" y="150" width="90" height="120" fill="#0075C1"/>
        <text x="315" y="290" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">UF</text>
        <text x="315" y="140" text-anchor="middle" fill="#0075C1" font-size="14">Ultrafiltration</text>
        <rect x="410" y="100" width="90" height="170" fill="#DDA11D"/>
        <text x="455" y="290" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">RO</text>
        <text x="455" y="90" text-anchor="middle" fill="#DDA11D" font-size="14" font-weight="700">Reverse Osmosis</text>
        <rect x="550" y="170" width="90" height="100" fill="#0075C1"/>
        <text x="595" y="290" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">NF</text>
        <text x="595" y="160" text-anchor="middle" fill="#0075C1" font-size="14">Nanofiltration</text>
        <rect x="690" y="220" width="90" height="50" fill="#0075C1"/>
        <text x="735" y="290" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">MBR</text>
        <text x="735" y="210" text-anchor="middle" fill="#0075C1" font-size="14">Bioreactor</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">MARKET</div><div class="v"><span class="y">Korea</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v"><span class="b">Membrane Tech</span></div></div>
    <div class="fact"><div class="k">SEGMENTS</div><div class="v">Water & Wastewater</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
