<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;
    --tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLLUTION · PFAS<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">PFAS</span> in Tap Water Traced to Upstream <span class="b">Wastewater Plant</span> Effluent</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <!-- Flow: Industrial source -> WWTP -> River -> Tap water -->
        <rect x="20" y="110" width="170" height="100" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="105" y="150" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Industrial</text>
        <text x="105" y="175" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Discharge</text>
        <polygon points="195,160 230,145 230,175" fill="#0075C1"/>

        <rect x="235" y="110" width="170" height="100" rx="12" fill="#0075C1"/>
        <text x="320" y="150" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#ffffff">Upstream</text>
        <text x="320" y="175" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#ffffff">WWTP</text>
        <polygon points="410,160 445,145 445,175" fill="#0075C1"/>

        <rect x="450" y="110" width="170" height="100" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="535" y="150" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">River</text>
        <text x="535" y="175" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Intake</text>
        <polygon points="625,160 660,145 660,175" fill="#0075C1"/>

        <rect x="665" y="110" width="200" height="100" rx="12" fill="#DDA11D"/>
        <text x="765" y="150" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#ffffff">Tap Water</text>
        <text x="765" y="175" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#ffffff">(PFAS Risk)</text>

        <text x="450" y="60" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#00205D">PFAS Transport Pathway</text>
        <text x="450" y="280" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">"Forever chemicals" persist through conventional treatment</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Pollution</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">PFAS in <span class="y">Tap Water</span></div></div>
    <div class="fact"><div class="k">SOURCE</div><div class="v">Upstream WWTP Effluent</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
