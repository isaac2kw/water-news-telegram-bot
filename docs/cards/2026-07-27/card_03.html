<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Lim Chang-yeol</span>: <span class="y">Guri</span> Sewage Plant Needs <span class="b">Modernization</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="900" height="320" fill="#F5F7FA" rx="16"/>
        <line x1="80" y1="200" x2="820" y2="200" stroke="#B5D4F4" stroke-width="3"/>
        <circle cx="150" cy="200" r="14" fill="#0075C1"/>
        <text x="150" y="160" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">1996</text>
        <text x="150" y="245" text-anchor="middle" fill="#888780" font-size="16">Original Build</text>
        <circle cx="380" cy="200" r="14" fill="#0075C1"/>
        <text x="380" y="160" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">30+ Years</text>
        <text x="380" y="245" text-anchor="middle" fill="#888780" font-size="16">Ageing Facility</text>
        <circle cx="610" cy="200" r="14" fill="#DDA11D"/>
        <text x="610" y="160" text-anchor="middle" fill="#DDA11D" font-size="22" font-weight="700">Proposal</text>
        <text x="610" y="245" text-anchor="middle" fill="#888780" font-size="16">Modernization</text>
        <circle cx="820" cy="200" r="14" fill="#00205D"/>
        <text x="820" y="160" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Future</text>
        <text x="820" y="245" text-anchor="middle" fill="#888780" font-size="16">Underground</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SITE</div><div class="v"><span class="y">Guri</span> Sewage Plant</div></div>
    <div class="fact"><div class="k">AGE</div><div class="v"><span class="b">30+ Years</span></div></div>
    <div class="fact"><div class="k">PROPOSAL</div><div class="v">Modernize &amp; Bury</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div>
  </div>
</div>
</body>
</html>
