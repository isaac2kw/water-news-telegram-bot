<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>SMART SAFETY<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Pohang</span> Deploys <span class="b">Smart Safety System</span> at 11 Sewage Sites</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="900" height="300" fill="#F5F7FA" rx="16"/>
        <text x="450" y="55" text-anchor="middle" fill="#00205D" font-size="24" font-weight="700">11 Facilities · Real-time Gas Monitoring</text>
        <g>
          <rect x="50" y="100" width="120" height="140" rx="10" fill="#ffffff" stroke="#0075C1" stroke-width="2"/>
          <text x="110" y="145" text-anchor="middle" fill="#DDA11D" font-size="14" font-weight="700">SENSOR</text>
          <text x="110" y="185" text-anchor="middle" fill="#00205D" font-size="34" font-weight="700">H₂S</text>
          <text x="110" y="215" text-anchor="middle" fill="#888780" font-size="12">Toxic Gas</text>
        </g>
        <g>
          <rect x="200" y="100" width="120" height="140" rx="10" fill="#ffffff" stroke="#0075C1" stroke-width="2"/>
          <text x="260" y="145" text-anchor="middle" fill="#DDA11D" font-size="14" font-weight="700">MONITOR</text>
          <text x="260" y="190" text-anchor="middle" fill="#00205D" font-size="26" font-weight="700">24/7</text>
          <text x="260" y="215" text-anchor="middle" fill="#888780" font-size="12">Real-time</text>
        </g>
        <g>
          <rect x="350" y="100" width="120" height="140" rx="10" fill="#ffffff" stroke="#0075C1" stroke-width="2"/>
          <text x="410" y="145" text-anchor="middle" fill="#DDA11D" font-size="14" font-weight="700">SITES</text>
          <text x="410" y="190" text-anchor="middle" fill="#00205D" font-size="34" font-weight="700">11</text>
          <text x="410" y="215" text-anchor="middle" fill="#888780" font-size="12">Facilities</text>
        </g>
        <g>
          <rect x="500" y="100" width="120" height="140" rx="10" fill="#ffffff" stroke="#0075C1" stroke-width="2"/>
          <text x="560" y="145" text-anchor="middle" fill="#DDA11D" font-size="14" font-weight="700">ALERT</text>
          <text x="560" y="190" text-anchor="middle" fill="#00205D" font-size="26" font-weight="700">Auto</text>
          <text x="560" y="215" text-anchor="middle" fill="#888780" font-size="12">Warning</text>
        </g>
        <g>
          <rect x="650" y="100" width="200" height="140" rx="10" fill="#0075C1"/>
          <text x="750" y="150" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">OUTCOME</text>
          <text x="750" y="195" text-anchor="middle" fill="#DDA11D" font-size="24" font-weight="700">Zero Incident</text>
          <text x="750" y="220" text-anchor="middle" fill="#ffffff" font-size="14">Prevention</text>
        </g>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SITES</div><div class="v"><span class="b">11 Facilities</span></div></div>
    <div class="fact"><div class="k">FEATURE</div><div class="v">Toxic Gas Sensor</div></div>
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Pohang</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div>
  </div>
</div>
</body>
</html>
