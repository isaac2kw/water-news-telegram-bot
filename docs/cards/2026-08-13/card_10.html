<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>DROUGHT · REUSE<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Drought Response: <span class="b">Reclaimed Sewage</span> Now Used as <span class="y">Agricultural Water</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="110" width="180" height="120" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="120" y="155" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Sewage</text>
        <text x="120" y="185" text-anchor="middle" fill="#0075C1" font-size="18">Effluent</text>
        <text x="120" y="212" text-anchor="middle" fill="#888780" font-size="14">Previously Discharged</text>
        <polygon points="225,160 265,160 265,145 300,180 265,215 265,195 225,195" fill="#0075C1"/>
        <rect x="315" y="110" width="180" height="120" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="405" y="150" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Advanced</text>
        <text x="405" y="180" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Reclamation</text>
        <text x="405" y="210" text-anchor="middle" fill="#0075C1" font-size="16">Filtration + Disinfection</text>
        <polygon points="510,160 550,160 550,145 585,180 550,215 550,195 510,195" fill="#DDA11D"/>
        <rect x="600" y="90" width="260" height="160" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="730" y="140" text-anchor="middle" fill="#0075C1" font-size="16" letter-spacing="2">END USE</text>
        <text x="730" y="185" text-anchor="middle" fill="#00205D" font-size="26" font-weight="700">Farm Irrigation</text>
        <text x="730" y="220" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">Drought Relief</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">DRIVER</div><div class="v"><span class="b">Drought</span></div></div>
    <div class="fact"><div class="k">SOURCE</div><div class="v">Reclaimed Water</div></div>
    <div class="fact"><div class="k">USE</div><div class="v"><span class="y">Agriculture</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row">
    <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
    <div class="center">Water Treatment</div><div class="right"></div>
  </div></div>
</div>
</body>
</html>
