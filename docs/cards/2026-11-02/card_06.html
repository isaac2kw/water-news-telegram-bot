<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET · DRIVERS<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle"><span class="b">PFAS Rules</span> & Membrane Filtration Drive <span class="y">5.8%</span> Market Growth</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="60" width="270" height="220" rx="16" fill="#E6F1FB"/>
        <text x="165" y="110" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2">DRIVER 1</text>
        <line x1="60" y1="130" x2="270" y2="130" stroke="#B5D4F4"/>
        <text x="165" y="180" text-anchor="middle" fill="#DDA11D" font-size="36" font-weight="700">PFAS</text>
        <text x="165" y="220" text-anchor="middle" fill="#00205D" font-size="18">Regulations</text>
        <text x="165" y="250" text-anchor="middle" fill="#00205D" font-size="18">Tightening</text>
        <rect x="315" y="60" width="270" height="220" rx="16" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="450" y="110" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2">DRIVER 2</text>
        <line x1="345" y1="130" x2="555" y2="130" stroke="#B5D4F4"/>
        <text x="450" y="180" text-anchor="middle" fill="#0075C1" font-size="28" font-weight="700">Membrane</text>
        <text x="450" y="215" text-anchor="middle" fill="#0075C1" font-size="28" font-weight="700">Filtration</text>
        <text x="450" y="255" text-anchor="middle" fill="#00205D" font-size="16">Core Technology</text>
        <rect x="600" y="60" width="270" height="220" rx="16" fill="#E6F1FB"/>
        <text x="735" y="110" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2">DRIVER 3</text>
        <line x1="630" y1="130" x2="840" y2="130" stroke="#B5D4F4"/>
        <text x="735" y="180" text-anchor="middle" fill="#00205D" font-size="28" font-weight="700">Digital</text>
        <text x="735" y="215" text-anchor="middle" fill="#00205D" font-size="28" font-weight="700">Water</text>
        <text x="735" y="255" text-anchor="middle" fill="#00205D" font-size="16">Smart Monitoring</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CAGR</div><div class="v"><span class="y">5.8%</span></div></div>
    <div class="fact"><div class="k">KEY TECH</div><div class="v">Membrane · PFAS</div></div>
    <div class="fact"><div class="k">OUTLOOK</div><div class="v"><span class="b">To 2036</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
