<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>FACILITY · MBR<span class="lbadge">US</span></div>
    <div class="ctitle"><span class="y">Republic</span> Opens <span class="y">Missouri</span>’s Largest <span class="b">MBR</span> Wastewater System</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="50" width="820" height="240" rx="16" fill="#F5F7FA"/>
        <text x="80" y="100" fill="#0075C1" font-size="18" font-weight="700" letter-spacing="2">MBR WASTEWATER TREATMENT</text>
        <rect x="80" y="140" width="150" height="100" rx="10" fill="#E6F1FB"/>
        <text x="155" y="180" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Influent</text>
        <text x="155" y="205" text-anchor="middle" fill="#00205D" font-size="14">Wastewater</text>
        <polygon points="245,190 285,175 285,205" fill="#0075C1"/>
        <rect x="295" y="140" width="150" height="100" rx="10" fill="#0075C1"/>
        <text x="370" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Bioreactor</text>
        <text x="370" y="205" text-anchor="middle" fill="#fff" font-size="14">+ Membrane</text>
        <polygon points="460,190 500,175 500,205" fill="#0075C1"/>
        <rect x="510" y="140" width="150" height="100" rx="10" fill="#DDA11D"/>
        <text x="585" y="180" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Filtration</text>
        <text x="585" y="205" text-anchor="middle" fill="#fff" font-size="14">Separation</text>
        <polygon points="675,190 715,175 715,205" fill="#0075C1"/>
        <rect x="725" y="140" width="120" height="100" rx="10" fill="#E6F1FB"/>
        <text x="785" y="180" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Clean</text>
        <text x="785" y="205" text-anchor="middle" fill="#00205D" font-size="14">Effluent</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">OWNER</div><div class="v"><span class="y">Republic</span></div></div>
    <div class="fact"><div class="k">STATE</div><div class="v"><span class="y">Missouri</span></div></div>
    <div class="fact"><div class="k">SCALE</div><div class="v"><span class="b">Largest MBR</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
