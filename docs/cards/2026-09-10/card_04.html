<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_04">
  <div class="pad">
    <div class="label"><span class="ldot"></span>COMPLIANCE<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Pohang</span> WWTP repeatedly discharges effluent <span class="b">above limits</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="270" x2="820" y2="270" stroke="#00205D" stroke-width="2"/>
        <line x1="80" y1="60" x2="80" y2="270" stroke="#00205D" stroke-width="2"/>

        <line x1="80" y1="170" x2="820" y2="170" stroke="#DDA11D" stroke-width="2" stroke-dasharray="6,6"/>
        <text x="830" y="175" font-size="16" fill="#DDA11D" font-weight="700">Limit</text>

        <rect x="140" y="200" width="80" height="70" fill="#0075C1"/>
        <text x="180" y="295" text-anchor="middle" font-size="16" fill="#00205D">Jan</text>

        <rect x="260" y="120" width="80" height="150" fill="#DDA11D"/>
        <text x="300" y="295" text-anchor="middle" font-size="16" fill="#00205D">Feb</text>

        <rect x="380" y="140" width="80" height="130" fill="#DDA11D"/>
        <text x="420" y="295" text-anchor="middle" font-size="16" fill="#00205D">Mar</text>

        <rect x="500" y="210" width="80" height="60" fill="#0075C1"/>
        <text x="540" y="295" text-anchor="middle" font-size="16" fill="#00205D">Apr</text>

        <rect x="620" y="100" width="80" height="170" fill="#DDA11D"/>
        <text x="660" y="295" text-anchor="middle" font-size="16" fill="#00205D">May</text>

        <text x="450" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Effluent quality vs. standard (illustrative)</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Pohang City</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v"><span class="b">Habitual</span> exceedance</div></div>
    <div class="fact"><div class="k">CAUSE</div><div class="v">Specific-process WWTP</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
