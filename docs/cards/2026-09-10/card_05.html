<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET<span class="lbadge">BRAZIL</span></div>
    <div class="ctitle"><span class="y">Brazil</span> <span class="b">hollow fiber membrane</span> module market outlook</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="60" width="380" height="220" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="250" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">Module Structure</text>
        <g transform="translate(150,140)">
          <rect x="0" y="0" width="200" height="110" rx="6" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
          <line x1="20" y1="15" x2="20" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="40" y1="15" x2="40" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="60" y1="15" x2="60" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="80" y1="15" x2="80" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="100" y1="15" x2="100" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="120" y1="15" x2="120" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="140" y1="15" x2="140" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="160" y1="15" x2="160" y2="95" stroke="#0075C1" stroke-width="2"/>
          <line x1="180" y1="15" x2="180" y2="95" stroke="#0075C1" stroke-width="2"/>
        </g>

        <rect x="480" y="60" width="360" height="220" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="660" y="105" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">Market Drivers</text>
        <text x="510" y="150" font-size="18" fill="#00205D">• Municipal water demand</text>
        <text x="510" y="185" font-size="18" fill="#00205D">• Industrial reuse growth</text>
        <text x="510" y="220" font-size="18" fill="#00205D">• MBR adoption</text>
        <text x="510" y="255" font-size="18" fill="#DDA11D" font-weight="700">• LatAm expansion</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">Brazil</span></div></div>
    <div class="fact"><div class="k">PRODUCT</div><div class="v"><span class="b">Hollow fiber</span> modules</div></div>
    <div class="fact"><div class="k">REPORT</div><div class="v">IndexBox market outlook</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
