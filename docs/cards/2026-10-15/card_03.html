<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY<span class="lbadge">PH</span></div>
    <div class="ctitle"><span class="b">MBR Technology</span> to Revolutionize Wastewater Treatment in <span class="y">Cebu</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#0075C1"/>
          </marker>
        </defs>
        <rect x="20" y="100" width="160" height="110" rx="12" fill="#E6F1FB"/>
        <text x="100" y="145" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Raw</text>
        <text x="100" y="175" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Wastewater</text>

        <rect x="230" y="100" width="200" height="110" rx="12" fill="#0075C1"/>
        <text x="330" y="145" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Biological</text>
        <text x="330" y="175" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Reactor</text>

        <rect x="480" y="100" width="200" height="110" rx="12" fill="#DDA11D"/>
        <text x="580" y="145" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Membrane</text>
        <text x="580" y="175" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Filtration</text>

        <rect x="730" y="100" width="150" height="110" rx="12" fill="#E6F1FB"/>
        <text x="805" y="145" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Clean</text>
        <text x="805" y="175" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Water</text>

        <line x1="185" y1="155" x2="225" y2="155" stroke="#0075C1" stroke-width="3" marker-end="url(#arr3)"/>
        <line x1="435" y1="155" x2="475" y2="155" stroke="#0075C1" stroke-width="3" marker-end="url(#arr3)"/>
        <line x1="685" y1="155" x2="725" y2="155" stroke="#0075C1" stroke-width="3" marker-end="url(#arr3)"/>

        <text x="450" y="275" text-anchor="middle" fill="#888780" font-size="18" font-style="italic">MBR = Biological Treatment + Membrane Separation</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Cebu</span>, Philippines</div></div>
    <div class="fact"><div class="k">TECHNOLOGY</div><div class="v"><span class="b">Membrane Bioreactor</span></div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">Clean Water Supply</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
