<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle"><span class="b">Industrial Wastewater</span> Market: Demand Patterns & Competitive Landscape</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="40" y="40" fill="#00205D" font-size="22" font-weight="700">Market Growth Drivers</text>
        <line x1="40" y1="55" x2="280" y2="55" stroke="#0075C1" stroke-width="3"/>

        <rect x="40" y="90" width="400" height="60" rx="8" fill="#F5F7FA"/>
        <circle cx="70" cy="120" r="12" fill="#0075C1"/>
        <text x="70" y="126" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">1</text>
        <text x="100" y="126" fill="#00205D" font-size="20" font-weight="600">Tightening Discharge Regulations</text>

        <rect x="40" y="165" width="400" height="60" rx="8" fill="#F5F7FA"/>
        <circle cx="70" cy="195" r="12" fill="#0075C1"/>
        <text x="70" y="201" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">2</text>
        <text x="100" y="201" fill="#00205D" font-size="20" font-weight="600">Industrial Expansion in Asia</text>

        <rect x="40" y="240" width="400" height="60" rx="8" fill="#F5F7FA"/>
        <circle cx="70" cy="270" r="12" fill="#0075C1"/>
        <text x="70" y="276" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">3</text>
        <text x="100" y="276" fill="#00205D" font-size="20" font-weight="600">Water Reuse & ZLD Adoption</text>

        <rect x="490" y="90" width="370" height="210" rx="12" fill="#E6F1FB"/>
        <text x="675" y="140" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Competitive Players</text>
        <text x="675" y="190" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">Veolia · SUEZ · Xylem</text>
        <text x="675" y="225" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">Toray · DuPont · Pentair</text>
        <text x="675" y="275" text-anchor="middle" fill="#888780" font-size="16">Membrane · MBR · AOP</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SEGMENT</div><div class="v">Industrial Wastewater</div></div>
    <div class="fact"><div class="k">OUTLOOK</div><div class="v"><span class="b">Rising Demand</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">Compliance & Reuse</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
