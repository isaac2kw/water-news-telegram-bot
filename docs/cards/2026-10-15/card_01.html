<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE<span class="lbadge">KR</span></div>
    <div class="ctitle">Heavy Rain Overloads <span class="y">Baengnyeong Island</span> Sewage Plant with <span class="b">Infiltration Water</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#0075C1"/>
          </marker>
        </defs>
        <rect x="30" y="60" width="200" height="110" rx="12" fill="#E6F1FB"/>
        <text x="130" y="105" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Heavy Rain</text>
        <text x="130" y="140" text-anchor="middle" fill="#888780" font-size="16">Island Weather</text>

        <rect x="350" y="60" width="200" height="110" rx="12" fill="#E6F1FB"/>
        <text x="450" y="105" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Sewer Lines</text>
        <text x="450" y="140" text-anchor="middle" fill="#888780" font-size="16">Infiltration</text>

        <rect x="670" y="60" width="200" height="110" rx="12" fill="#DDA11D"/>
        <text x="770" y="105" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">WWTP</text>
        <text x="770" y="140" text-anchor="middle" fill="#ffffff" font-size="16">Overload</text>

        <line x1="235" y1="115" x2="345" y2="115" stroke="#0075C1" stroke-width="3" marker-end="url(#arr1)"/>
        <line x1="555" y1="115" x2="665" y2="115" stroke="#0075C1" stroke-width="3" marker-end="url(#arr1)"/>

        <rect x="150" y="220" width="600" height="80" rx="12" fill="#F5F7FA"/>
        <text x="450" y="255" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Non-Sewage Inflow Exceeds Plant Capacity</text>
        <text x="450" y="282" text-anchor="middle" fill="#888780" font-size="16">Treatment Efficiency Drops Sharply During Storms</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Baengnyeong Island</span></div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v">Infiltration Water Overload</div></div>
    <div class="fact"><div class="k">TRIGGER</div><div class="v">Concentrated Rainfall</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
