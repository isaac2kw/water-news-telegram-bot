<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_02">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY<span class="lbadge">KR</span></div>
    <div class="ctitle"><span class="y">Cheongju</span> Council Calls for Precise <span class="b">Water Composition Analysis</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="40" width="840" height="280" rx="16" fill="#F5F7FA"/>
        <text x="60" y="90" fill="#00205D" font-size="24" font-weight="700">Proposed Analysis Parameters</text>
        <line x1="60" y1="105" x2="300" y2="105" stroke="#0075C1" stroke-width="3"/>

        <circle cx="150" cy="180" r="40" fill="#E6F1FB"/>
        <text x="150" y="186" text-anchor="middle" fill="#0075C1" font-size="20" font-weight="700">BOD</text>
        <text x="150" y="245" text-anchor="middle" fill="#00205D" font-size="16" font-weight="600">Organics</text>

        <circle cx="320" cy="180" r="40" fill="#E6F1FB"/>
        <text x="320" y="186" text-anchor="middle" fill="#0075C1" font-size="20" font-weight="700">TN</text>
        <text x="320" y="245" text-anchor="middle" fill="#00205D" font-size="16" font-weight="600">Nitrogen</text>

        <circle cx="490" cy="180" r="40" fill="#E6F1FB"/>
        <text x="490" y="186" text-anchor="middle" fill="#0075C1" font-size="20" font-weight="700">TP</text>
        <text x="490" y="245" text-anchor="middle" fill="#00205D" font-size="16" font-weight="600">Phosphorus</text>

        <circle cx="660" cy="180" r="40" fill="#DDA11D"/>
        <text x="660" y="186" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Heavy</text>
        <text x="660" y="245" text-anchor="middle" fill="#00205D" font-size="16" font-weight="600">Metals</text>

        <circle cx="810" cy="180" r="40" fill="#DDA11D"/>
        <text x="810" y="186" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">Micro</text>
        <text x="810" y="245" text-anchor="middle" fill="#00205D" font-size="16" font-weight="600">Pollutants</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">PROPOSER</div><div class="v"><span class="y">Lee Han-guk</span>, Council</div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">Sewage Plant Effluent</div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">Water Quality Transparency</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
