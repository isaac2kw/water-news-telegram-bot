<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:46px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>RESEARCH<span class="lbadge">VIETNAM</span></div>
    <div class="ctitle"><span class="y">VNU-HCM</span> <span class="b">MBR</span> Project: Nitrogen Removal in Seafood Wastewater</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="40" width="200" height="200" fill="#E6F1FB" rx="12"/>
        <text x="130" y="90" font-family="Helvetica" font-size="18" fill="#888780" text-anchor="middle" letter-spacing="2">FEED</text>
        <text x="130" y="140" font-family="Helvetica" font-size="24" fill="#00205D" text-anchor="middle" font-weight="700">Seafood WW</text>
        <text x="130" y="180" font-family="Helvetica" font-size="18" fill="#DDA11D" text-anchor="middle" font-weight="700">High N</text>
        <polygon points="245,140 285,120 285,160" fill="#0075C1"/>
        <rect x="300" y="40" width="300" height="200" fill="#0075C1" rx="12"/>
        <text x="450" y="90" font-family="Helvetica" font-size="18" fill="#B5D4F4" text-anchor="middle" letter-spacing="2">MBR + CARRIER</text>
        <text x="450" y="140" font-family="Helvetica" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="700">Hybrid</text>
        <text x="450" y="180" font-family="Helvetica" font-size="18" fill="#ffffff" text-anchor="middle">membrane + biosubstrate</text>
        <text x="450" y="215" font-family="Helvetica" font-size="14" fill="#B5D4F4" text-anchor="middle">nitrification / denitrification</text>
        <polygon points="615,140 655,120 655,160" fill="#0075C1"/>
        <rect x="670" y="40" width="200" height="200" fill="#E6F1FB" rx="12"/>
        <text x="770" y="90" font-family="Helvetica" font-size="18" fill="#888780" text-anchor="middle" letter-spacing="2">EFFLUENT</text>
        <text x="770" y="140" font-family="Helvetica" font-size="26" fill="#00205D" text-anchor="middle" font-weight="700">Low N</text>
        <text x="770" y="180" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle">reusable</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">INSTITUTE</div><div class="v"><span class="y">VNU-HCM</span></div></div>
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">MBR</span> + biosubstrate</div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">Nitrogen removal</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
