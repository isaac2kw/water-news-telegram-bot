<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:48px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="b">724</span> Sewage Plants Aging: Shift to Integration, Resource Recovery &amp; Undergrounding</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="60" width="260" height="180" fill="#E6F1FB" rx="14"/>
        <text x="150" y="110" font-family="Helvetica" font-size="20" fill="#0075C1" text-anchor="middle" font-weight="700" letter-spacing="2">INTEGRATION</text>
        <text x="150" y="160" font-family="Helvetica" font-size="36" fill="#00205D" text-anchor="middle" font-weight="700">◇</text>
        <text x="150" y="200" font-family="Helvetica" font-size="16" fill="#888780" text-anchor="middle">Consolidate plants</text>
        <rect x="320" y="60" width="260" height="180" fill="#E6F1FB" rx="14"/>
        <text x="450" y="110" font-family="Helvetica" font-size="20" fill="#0075C1" text-anchor="middle" font-weight="700" letter-spacing="2">RESOURCE</text>
        <text x="450" y="160" font-family="Helvetica" font-size="36" fill="#00205D" text-anchor="middle" font-weight="700">♻</text>
        <text x="450" y="200" font-family="Helvetica" font-size="16" fill="#888780" text-anchor="middle">Energy &amp; reuse</text>
        <rect x="620" y="60" width="260" height="180" fill="#E6F1FB" rx="14"/>
        <text x="750" y="110" font-family="Helvetica" font-size="20" fill="#0075C1" text-anchor="middle" font-weight="700" letter-spacing="2">UNDERGROUND</text>
        <text x="750" y="160" font-family="Helvetica" font-size="36" fill="#00205D" text-anchor="middle" font-weight="700">▽</text>
        <text x="750" y="200" font-family="Helvetica" font-size="16" fill="#888780" text-anchor="middle">Space efficiency</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">PLANTS</div><div class="v"><span class="b">724</span> nationwide</div></div>
    <div class="fact"><div class="k">STRATEGY</div><div class="v">3-pillar transition</div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">Modern facilities</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
