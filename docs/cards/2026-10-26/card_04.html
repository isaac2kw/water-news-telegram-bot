<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_04">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">QUA</span> Launches <span class="b">EnviQ RF 30</span> Compact MBR for Decentralized Treatment</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="900" height="320" fill="#F5F7FA" rx="16"/>
        <text x="60" y="55" font-family="Helvetica" font-size="20" fill="#888780" letter-spacing="2">PRODUCT FEATURES — EnviQ RF 30</text>
        <rect x="60" y="90" width="245" height="200" rx="12" fill="#fff" stroke="#B5D4F4"/>
        <circle cx="182" cy="150" r="26" fill="#E6F1FB"/>
        <text x="182" y="158" text-anchor="middle" font-family="Helvetica" font-size="26" font-weight="700" fill="#0075C1">⚙</text>
        <text x="182" y="210" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#00205D">Compact</text>
        <text x="182" y="240" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">Small Footprint</text>
        <rect x="327" y="90" width="245" height="200" rx="12" fill="#fff" stroke="#B5D4F4"/>
        <circle cx="449" cy="150" r="26" fill="#E6F1FB"/>
        <text x="449" y="158" text-anchor="middle" font-family="Helvetica" font-size="26" font-weight="700" fill="#0075C1">▶</text>
        <text x="449" y="210" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#00205D">Ready-to-Install</text>
        <text x="449" y="240" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">Plug &amp; Play</text>
        <rect x="594" y="90" width="245" height="200" rx="12" fill="#fff" stroke="#B5D4F4"/>
        <circle cx="716" cy="150" r="26" fill="#DDA11D"/>
        <text x="716" y="158" text-anchor="middle" font-family="Helvetica" font-size="26" font-weight="700" fill="#fff">M</text>
        <text x="716" y="210" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#00205D">MBR Core</text>
        <text x="716" y="240" text-anchor="middle" font-family="Helvetica" font-size="16" fill="#888780">Membrane Bioreactor</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">COMPANY</div><div class="v"><span class="y">QUA</span></div></div>
    <div class="fact"><div class="k">PRODUCT</div><div class="v"><span class="b">EnviQ RF 30</span></div></div>
    <div class="fact"><div class="k">USE CASE</div><div class="v">Decentralized WWT</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
