<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:36px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>SOCIAL CONFLICT<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Halted <span class="b">3 Times</span> by Protests & Lawsuits — <span class="y">Jeju Eastern WWTP</span> Opens</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="60" width="180" height="180" rx="14" fill="#E6F1FB"/>
        <text x="130" y="130" font-family="Helvetica" font-size="42" font-weight="700" fill="#DDA11D" text-anchor="middle">3</text>
        <text x="130" y="170" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">STOPPAGES</text>
        <text x="130" y="200" font-family="Helvetica" font-size="14" fill="#888780" text-anchor="middle">during construction</text>

        <rect x="240" y="60" width="180" height="180" rx="14" fill="#E6F1FB"/>
        <text x="330" y="130" font-family="Helvetica" font-size="42" font-weight="700" fill="#DDA11D" text-anchor="middle">6</text>
        <text x="330" y="170" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">YEARS</text>
        <text x="330" y="200" font-family="Helvetica" font-size="14" fill="#888780" text-anchor="middle">of dispute</text>

        <rect x="440" y="60" width="180" height="180" rx="14" fill="#E6F1FB"/>
        <text x="530" y="130" font-family="Helvetica" font-size="42" font-weight="700" fill="#0075C1" text-anchor="middle">9</text>
        <text x="530" y="170" font-family="Helvetica" font-size="18" fill="#00205D" text-anchor="middle" font-weight="700">YEARS</text>
        <text x="530" y="200" font-family="Helvetica" font-size="14" fill="#888780" text-anchor="middle">to complete</text>

        <rect x="640" y="60" width="220" height="180" rx="14" fill="#0075C1"/>
        <text x="750" y="130" font-family="Helvetica" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">RESOLVED</text>
        <text x="750" y="170" font-family="Helvetica" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">2026 COMPLETION</text>
        <text x="750" y="200" font-family="Helvetica" font-size="14" fill="#B5D4F4" text-anchor="middle">operations begin</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">STOPPAGES</div><div class="v"><span class="b">3 times</span> halted</div></div>
    <div class="fact"><div class="k">DISPUTE</div><div class="v"><span class="y">6-year</span> conflict</div></div>
    <div class="fact"><div class="k">OUTCOME</div><div class="v">Now operational</div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
