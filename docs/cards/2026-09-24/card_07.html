<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_07">
  <div class="pad">
    <div class="label"><span class="ldot"></span>WATER MANAGEMENT<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Jeju Eastern WWTP</span> Expansion Boosts <span class="b">East-Region</span> Water Base</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="50" y="80" width="220" height="200" rx="14" fill="#E6F1FB"/>
        <circle cx="160" cy="150" r="30" fill="#0075C1"/>
        <text x="160" y="158" font-family="Helvetica" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">E</text>
        <text x="160" y="215" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D" text-anchor="middle">EAST REGION</text>
        <text x="160" y="245" font-family="Helvetica" font-size="16" fill="#888780" text-anchor="middle">Jeju eastern coast</text>

        <path d="M280 180 L370 180" stroke="#DDA11D" stroke-width="4"/>
        <polygon points="365,170 385,180 365,190" fill="#DDA11D"/>

        <rect x="390" y="80" width="220" height="200" rx="14" fill="#0075C1"/>
        <circle cx="500" cy="150" r="34" fill="#DDA11D"/>
        <text x="500" y="158" font-family="Helvetica" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">WWTP</text>
        <text x="500" y="215" font-family="Helvetica" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">EASTERN PLANT</text>
        <text x="500" y="245" font-family="Helvetica" font-size="16" fill="#B5D4F4" text-anchor="middle">Doubled capacity</text>

        <path d="M620 180 L710 180" stroke="#DDA11D" stroke-width="4"/>
        <polygon points="705,170 725,180 705,190" fill="#DDA11D"/>

        <rect x="730" y="80" width="120" height="200" rx="14" fill="#E6F1FB"/>
        <text x="790" y="160" font-family="Helvetica" font-size="30" font-weight="700" fill="#0075C1" text-anchor="middle">✓</text>
        <text x="790" y="200" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D" text-anchor="middle">STABLE</text>
        <text x="790" y="225" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D" text-anchor="middle">SUPPLY</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SERVICE AREA</div><div class="v"><span class="y">East Jeju</span></div></div>
    <div class="fact"><div class="k">IMPACT</div><div class="v">Water base expanded</div></div>
    <div class="fact"><div class="k">MODE</div><div class="v"><span class="b">Full operation</span></div></div>
  </div>
  <div class="footer"><div class="line"></div><div class="row"><div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div><div class="center">Water Treatment</div><div class="right"></div></div></div>
</div>
</body>
</html>
