<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --main-blue:#0075C1;
    --yellow:#DDA11D;
    --navy:#00205D;
    --tint:#E6F1FB;
    --card-bg:#F5F7FA;
    --line:#B5D4F4;
    --gray-light:#888780;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_02">
  <div class="pad">
    <div class="label"><span class="ldot"></span>RESEARCH · WATER QUALITY<span class="lbadge">KR</span></div>
    <div class="ctitle"><span class="y">Changwon Nat'l Univ.</span> team reveals <span class="b">environmental risk</span> of residual pharmaceuticals in WWTPs</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Flow diagram: pharma → WWTP → effluent → ecosystem risk -->
        <text x="0" y="28" font-family="Helvetica,Arial" font-size="20" font-weight="700" fill="#00205D">PATHWAY OF RESIDUAL PHARMACEUTICALS</text>
        <line x1="0" y1="48" x2="900" y2="48" stroke="#B5D4F4" stroke-width="1"/>

        <!-- Node 1: Pharma use -->
        <rect x="20" y="100" width="180" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="110" y="150" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">Pharma</text>
        <text x="110" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">Use</text>
        <text x="110" y="202" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#888780">Human / Hospital</text>

        <polygon points="210,160 250,145 250,155 275,155 275,165 250,165 250,175" fill="#0075C1"/>

        <!-- Node 2: WWTP -->
        <rect x="285" y="100" width="180" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="375" y="150" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">WWTP</text>
        <text x="375" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">Treatment</text>
        <text x="375" y="202" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#888780">Partial removal</text>

        <polygon points="475,160 515,145 515,155 540,155 540,165 515,165 515,175" fill="#0075C1"/>

        <!-- Node 3: Effluent -->
        <rect x="550" y="100" width="180" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="640" y="150" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">Effluent</text>
        <text x="640" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">Discharge</text>
        <text x="640" y="202" text-anchor="middle" font-family="Helvetica,Arial" font-size="13" fill="#888780">Rivers / Streams</text>

        <polygon points="740,160 780,145 780,155 805,155 805,165 780,165 780,175" fill="#DDA11D"/>

        <!-- Node 4: Risk -->
        <rect x="815" y="100" width="80" height="120" rx="14" fill="#DDA11D"/>
        <text x="855" y="150" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="700" fill="#ffffff">ECO</text>
        <text x="855" y="175" text-anchor="middle" font-family="Helvetica,Arial" font-size="16" font-weight="700" fill="#ffffff">RISK</text>

        <text x="450" y="275" text-anchor="middle" font-family="Helvetica,Arial" font-size="15" fill="#888780">Research identifies environmental hazard of residual compounds in treated water</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">INSTITUTION</div><div class="v"><span class="y">Changwon Nat'l Univ.</span></div></div>
    <div class="fact"><div class="k">LEAD</div><div class="v">Prof. <span class="y">Jun-ho Jeon</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v"><span class="b">Pharma residues</span> risk</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
