<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{
    --main-blue:#0075C1;
    --yellow:#DDA11D;
    --navy:#00205D;
    --tint:#E6F1FB;
    --card-bg:#F5F7FA;
    --line:#B5D4F4;
    --gray-light:#888780;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE · INVESTMENT<span class="lbadge">KR</span></div>
    <div class="ctitle"><span class="y">Taean County</span> invests <span class="b">KRW 20B</span> in <span class="y">Sindeok-ri</span> WWTP, completion by <span class="b">2030</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <!-- Bar chart: investment scale + timeline -->
        <text x="0" y="30" font-family="Helvetica,Arial" font-size="20" font-weight="700" fill="#00205D">PROJECT TIMELINE &amp; BUDGET</text>
        <line x1="0" y1="50" x2="900" y2="50" stroke="#B5D4F4" stroke-width="1"/>

        <!-- Timeline axis -->
        <line x1="60" y1="240" x2="840" y2="240" stroke="#B5D4F4" stroke-width="2"/>

        <!-- Milestones -->
        <circle cx="120" cy="240" r="12" fill="#0075C1"/>
        <text x="120" y="275" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">2026</text>
        <text x="120" y="297" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#888780">Announced</text>

        <circle cx="360" cy="240" r="12" fill="#0075C1"/>
        <text x="360" y="275" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">2027</text>
        <text x="360" y="297" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#888780">Design</text>

        <circle cx="600" cy="240" r="12" fill="#0075C1"/>
        <text x="600" y="275" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">2028</text>
        <text x="600" y="297" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#888780">Construction</text>

        <circle cx="780" cy="240" r="16" fill="#DDA11D"/>
        <text x="780" y="275" text-anchor="middle" font-family="Helvetica,Arial" font-size="18" font-weight="700" fill="#00205D">2030</text>
        <text x="780" y="297" text-anchor="middle" font-family="Helvetica,Arial" font-size="14" fill="#888780">Completion</text>

        <!-- Budget callout -->
        <rect x="60" y="90" width="780" height="110" rx="14" fill="#E6F1FB"/>
        <text x="90" y="130" font-family="Helvetica,Arial" font-size="18" font-weight="600" letter-spacing="2" fill="#0075C1">TOTAL INVESTMENT</text>
        <text x="90" y="180" font-family="Helvetica,Arial" font-size="46" font-weight="700" fill="#00205D">KRW <tspan fill="#DDA11D">20 Billion</tspan> <tspan font-size="22" fill="#888780">(~USD 15M)</tspan></text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Sindeok-ri, Taean</span></div></div>
    <div class="fact"><div class="k">BUDGET</div><div class="v"><span class="b">KRW 20B</span></div></div>
    <div class="fact"><div class="k">COMPLETION</div><div class="v">By <span class="b">2030</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
