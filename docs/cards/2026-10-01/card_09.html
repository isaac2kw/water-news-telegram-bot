<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:54px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>WATER REUSE<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Treated Water & Heat Reused — WWTPs Enter <span class="b">Smart Recycling</span> Era</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="80" width="180" height="180" fill="#0075C1" rx="12"/>
        <text x="130" y="140" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">WWTP</text>
        <text x="130" y="170" text-anchor="middle" fill="#E6F1FB" font-size="14">Inflow &</text>
        <text x="130" y="190" text-anchor="middle" fill="#E6F1FB" font-size="14">Treatment</text>
        <polygon points="240,170 290,150 290,165 330,165 330,185 290,185 290,200" fill="#DDA11D"/>
        <rect x="350" y="60" width="200" height="100" fill="#DDA11D" rx="10"/>
        <text x="450" y="100" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">TREATED</text>
        <text x="450" y="128" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">WATER</text>
        <rect x="350" y="180" width="200" height="100" fill="#DDA11D" rx="10"/>
        <text x="450" y="220" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">HEAT</text>
        <text x="450" y="248" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">RECOVERY</text>
        <polygon points="570,110 620,90 620,105 660,105 660,125 620,125 620,140" fill="#B5D4F4"/>
        <polygon points="570,230 620,210 620,225 660,225 660,245 620,245 620,260" fill="#B5D4F4"/>
        <rect x="680" y="80" width="180" height="180" fill="#00205D" rx="12"/>
        <text x="770" y="155" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">SMART</text>
        <text x="770" y="185" text-anchor="middle" fill="#DDA11D" font-size="20" font-weight="700">RECYCLING</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">STREAMS</div><div class="v">Water + Heat</div></div>
    <div class="fact"><div class="k">APPROACH</div><div class="v"><span class="b">Smart Recycling</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">WWTP Networks</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
