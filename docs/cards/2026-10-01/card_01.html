<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>ENERGY REUSE<span class="lbadge">KOREA</span></div>
    <div class="ctitle">Sewage Heat & <span class="b">Biogas</span> Reuse Delivers <span class="y">KRW 650M</span> Annual Benefit</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="200" width="140" height="80" fill="#0075C1" rx="6"/>
        <text x="110" y="248" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Sewage</text>
        <text x="110" y="300" text-anchor="middle" fill="#00205D" font-size="16">Heat</text>
        <rect x="220" y="150" width="140" height="130" fill="#DDA11D" rx="6"/>
        <text x="290" y="220" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Biogas</text>
        <text x="290" y="300" text-anchor="middle" fill="#00205D" font-size="16">Reuse</text>
        <polygon points="380,240 440,210 440,225 500,225 500,255 440,255 440,270" fill="#B5D4F4"/>
        <rect x="520" y="100" width="320" height="180" fill="#E6F1FB" rx="12" stroke="#0075C1" stroke-width="3"/>
        <text x="680" y="160" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">ANNUAL BENEFIT</text>
        <text x="680" y="220" text-anchor="middle" fill="#DDA11D" font-size="48" font-weight="700">KRW 650M</text>
        <text x="680" y="255" text-anchor="middle" fill="#888780" font-size="16">Energy Savings per Year</text>
        <text x="40" y="60" fill="#00205D" font-size="22" font-weight="700">Dual Reuse Streams</text>
        <text x="40" y="90" fill="#888780" font-size="16">Converting WWTP by-products into usable energy</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Energy Reuse</span></div></div>
    <div class="fact"><div class="k">SOURCES</div><div class="v">Sewage Heat + Biogas</div></div>
    <div class="fact"><div class="k">BENEFIT</div><div class="v"><span class="y">KRW 650M</span> / year</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
