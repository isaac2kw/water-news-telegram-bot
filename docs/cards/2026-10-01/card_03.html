<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:54px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:48px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE<span class="lbadge">KOREA</span></div>
    <div class="ctitle">WWTPs Overloaded <span class="y">334 Times</span> in 6 Years — <span class="b">18 Plants</span> Exceeded Capacity Annually</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <line x1="60" y1="280" x2="860" y2="280" stroke="#B5D4F4" stroke-width="2"/>
        <line x1="60" y1="60" x2="60" y2="280" stroke="#B5D4F4" stroke-width="2"/>
        <rect x="110" y="200" width="80" height="80" fill="#0075C1"/>
        <text x="150" y="190" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">42</text>
        <text x="150" y="305" text-anchor="middle" fill="#888780" font-size="14">Y1</text>
        <rect x="230" y="170" width="80" height="110" fill="#0075C1"/>
        <text x="270" y="160" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">55</text>
        <text x="270" y="305" text-anchor="middle" fill="#888780" font-size="14">Y2</text>
        <rect x="350" y="150" width="80" height="130" fill="#0075C1"/>
        <text x="390" y="140" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">62</text>
        <text x="390" y="305" text-anchor="middle" fill="#888780" font-size="14">Y3</text>
        <rect x="470" y="140" width="80" height="140" fill="#0075C1"/>
        <text x="510" y="130" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">58</text>
        <text x="510" y="305" text-anchor="middle" fill="#888780" font-size="14">Y4</text>
        <rect x="590" y="120" width="80" height="160" fill="#DDA11D"/>
        <text x="630" y="110" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">63</text>
        <text x="630" y="305" text-anchor="middle" fill="#888780" font-size="14">Y5</text>
        <rect x="710" y="110" width="80" height="170" fill="#DDA11D"/>
        <text x="750" y="100" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">54</text>
        <text x="750" y="305" text-anchor="middle" fill="#888780" font-size="14">Y6</text>
        <text x="60" y="45" fill="#00205D" font-size="18" font-weight="700">Overload Cases per Year</text>
        <text x="860" y="45" text-anchor="end" fill="#DDA11D" font-size="22" font-weight="700">TOTAL: 334</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">PERIOD</div><div class="v">6 Years</div></div>
    <div class="fact"><div class="k">TOTAL CASES</div><div class="v"><span class="y">334</span> overloads</div></div>
    <div class="fact"><div class="k">CHRONIC</div><div class="v"><span class="b">18 plants</span> yearly</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
