<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_04">
  <div class="pad">
    <div class="label"><span class="ldot"></span>SAFETY DRILL<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Gwangyang City</span> runs <span class="b">confined-space rescue drill</span> at public WWTP</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="70" width="180" height="200" rx="10" fill="#F5F7FA" stroke="#0075C1" stroke-width="2"/>
        <text x="150" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#0075C1">STEP 1</text>
        <text x="150" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">DETECT</text>
        <text x="150" y="195" text-anchor="middle" font-size="15" fill="#00205D">Confined</text>
        <text x="150" y="215" text-anchor="middle" font-size="15" fill="#00205D">Space Risk</text>
        <polygon points="250,170 290,160 290,180" fill="#0075C1"/>
        <rect x="300" y="70" width="180" height="200" rx="10" fill="#F5F7FA" stroke="#DDA11D" stroke-width="2"/>
        <text x="390" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#DDA11D">STEP 2</text>
        <text x="390" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">ALERT</text>
        <text x="390" y="195" text-anchor="middle" font-size="15" fill="#00205D">Emergency</text>
        <text x="390" y="215" text-anchor="middle" font-size="15" fill="#00205D">Response Team</text>
        <polygon points="490,170 530,160 530,180" fill="#0075C1"/>
        <rect x="540" y="70" width="180" height="200" rx="10" fill="#F5F7FA" stroke="#0075C1" stroke-width="2"/>
        <text x="630" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#0075C1">STEP 3</text>
        <text x="630" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">RESCUE</text>
        <text x="630" y="195" text-anchor="middle" font-size="15" fill="#00205D">Extract &amp;</text>
        <text x="630" y="215" text-anchor="middle" font-size="15" fill="#00205D">Stabilize</text>
        <polygon points="730,170 770,160 770,180" fill="#0075C1"/>
        <rect x="780" y="110" width="100" height="120" rx="10" fill="#DDA11D"/>
        <text x="830" y="175" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">SAFE</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Gwangyang</span></div></div>
    <div class="fact"><div class="k">TYPE</div><div class="v"><span class="b">Confined Space</span></div></div>
    <div class="fact"><div class="k">PURPOSE</div><div class="v">Emergency Rescue</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
