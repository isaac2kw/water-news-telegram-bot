<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#fff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>REGULATION<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Salisbury</span> residents challenge <span class="y">Perdue</span> wastewater permit over <span class="b">PFAS</span> concerns</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="100" width="200" height="140" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="160" y="150" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">RESIDENTS</text>
        <text x="160" y="180" text-anchor="middle" font-size="16" fill="#00205D">Salisbury</text>
        <text x="160" y="205" text-anchor="middle" font-size="16" fill="#00205D">Community</text>

        <polygon points="270,170 320,155 320,185" fill="#DDA11D"/>
        <text x="370" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#DDA11D">CHALLENGE</text>
        <text x="370" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#DDA11D">PFAS risk</text>

        <circle cx="500" cy="170" r="55" fill="#F5F7FA" stroke="#DDA11D" stroke-width="3"/>
        <text x="500" y="165" text-anchor="middle" font-size="18" font-weight="700" fill="#DDA11D">PERMIT</text>
        <text x="500" y="190" text-anchor="middle" font-size="14" fill="#00205D">Under review</text>

        <polygon points="570,170 620,155 620,185" fill="#0075C1"/>

        <rect x="630" y="100" width="210" height="140" rx="12" fill="#F5F7FA" stroke="#00205D" stroke-width="2"/>
        <text x="735" y="145" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">PERDUE</text>
        <text x="735" y="175" text-anchor="middle" font-size="16" fill="#00205D">Wastewater</text>
        <text x="735" y="200" text-anchor="middle" font-size="16" fill="#00205D">Discharge</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Salisbury</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v"><span class="y">Perdue</span> Permit</div></div>
    <div class="fact"><div class="k">ISSUE</div><div class="v"><span class="b">PFAS Concerns</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
