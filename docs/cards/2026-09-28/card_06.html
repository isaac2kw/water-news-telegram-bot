<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:54px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY · R&D<span class="lbadge">RESEARCH</span></div>
    <div class="ctitle"><span class="b">Water-Fighting Membrane</span> Gets Double Makeover to Clean Wastewater Faster</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="220" y="50" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">BEFORE</text>
        <text x="680" y="50" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">AFTER (Double Makeover)</text>
        <rect x="70" y="80" width="300" height="180" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="220" y="120" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">Hydrophobic Membrane</text>
        <line x1="100" y1="150" x2="340" y2="150" stroke="#B5D4F4" stroke-width="3"/>
        <line x1="100" y1="180" x2="340" y2="180" stroke="#B5D4F4" stroke-width="3"/>
        <line x1="100" y1="210" x2="340" y2="210" stroke="#B5D4F4" stroke-width="3"/>
        <text x="220" y="245" text-anchor="middle" fill="#888780" font-size="15">Slow Water Flux</text>
        <polygon points="395,170 445,155 445,185" fill="#DDA11D"/>
        <rect x="470" y="80" width="380" height="180" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="660" y="120" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700">Dual-Modified Surface</text>
        <line x1="500" y1="150" x2="820" y2="150" stroke="#0075C1" stroke-width="3"/>
        <line x1="500" y1="180" x2="820" y2="180" stroke="#0075C1" stroke-width="3"/>
        <line x1="500" y1="210" x2="820" y2="210" stroke="#0075C1" stroke-width="3"/>
        <circle cx="540" cy="165" r="6" fill="#DDA11D"/>
        <circle cx="620" cy="195" r="6" fill="#DDA11D"/>
        <circle cx="720" cy="165" r="6" fill="#DDA11D"/>
        <circle cx="790" cy="195" r="6" fill="#DDA11D"/>
        <text x="660" y="245" text-anchor="middle" fill="#00205D" font-size="15" font-weight="700">Faster Wastewater Cleaning</text>
        <text x="450" y="300" text-anchor="middle" fill="#888780" font-size="14">Surface engineering to overcome water-repelling behavior</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">Modified Membrane</span></div></div>
    <div class="fact"><div class="k">APPROACH</div><div class="v">Dual Surface Treatment</div></div>
    <div class="fact"><div class="k">BENEFIT</div><div class="v">Faster Wastewater Cleaning</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
