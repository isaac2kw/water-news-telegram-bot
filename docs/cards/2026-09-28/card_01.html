<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>REUSE · MEMBRANE<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle">Optimizing <span class="b">Membrane Biofouling</span> Control in Potable Water Reuse Trains</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="140" width="150" height="80" rx="10" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="105" y="175" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">SECONDARY</text>
        <text x="105" y="200" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">EFFLUENT</text>
        <polygon points="185,180 220,165 220,195" fill="#0075C1"/>
        <rect x="230" y="140" width="150" height="80" rx="10" fill="#F5F7FA" stroke="#0075C1" stroke-width="2"/>
        <text x="305" y="175" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">MF / UF</text>
        <text x="305" y="200" text-anchor="middle" fill="#00205D" font-size="16">Pretreatment</text>
        <polygon points="385,180 420,165 420,195" fill="#0075C1"/>
        <rect x="430" y="140" width="150" height="80" rx="10" fill="#DDA11D" stroke="#DDA11D" stroke-width="2"/>
        <text x="505" y="175" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">RO MEMBRANE</text>
        <text x="505" y="200" text-anchor="middle" fill="#ffffff" font-size="16">Biofouling Zone</text>
        <polygon points="585,180 620,165 620,195" fill="#0075C1"/>
        <rect x="630" y="140" width="150" height="80" rx="10" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="705" y="175" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">UV / AOP</text>
        <text x="705" y="200" text-anchor="middle" fill="#00205D" font-size="16">Potable Reuse</text>
        <text x="450" y="60" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">Biofouling Control Points</text>
        <circle cx="505" cy="100" r="8" fill="#DDA11D"/>
        <text x="525" y="106" fill="#00205D" font-size="16">Critical stage: flux decline & CIP frequency</text>
        <text x="105" y="270" text-anchor="middle" fill="#888780" font-size="14">Source</text>
        <text x="305" y="270" text-anchor="middle" fill="#888780" font-size="14">Barrier 1</text>
        <text x="505" y="270" text-anchor="middle" fill="#888780" font-size="14">Barrier 2</text>
        <text x="705" y="270" text-anchor="middle" fill="#888780" font-size="14">Polishing</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">FOCUS</div><div class="v"><span class="b">Biofouling</span> Control</div></div>
    <div class="fact"><div class="k">APPLICATION</div><div class="v">Potable Water Reuse</div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">Stable Flux & CIP Reduction</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
