<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INFRASTRUCTURE · FUNDING<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Norfolk</span> Wastewater Treatment Plant <span class="b">Expansion Funding</span> Announced</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="450" y="50" text-anchor="middle" fill="#00205D" font-size="22" font-weight="700">WWTP Expansion Roadmap</text>
        <line x1="80" y1="180" x2="820" y2="180" stroke="#B5D4F4" stroke-width="3"/>
        <circle cx="150" cy="180" r="18" fill="#0075C1"/>
        <text x="150" y="230" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">FUNDING</text>
        <text x="150" y="252" text-anchor="middle" fill="#888780" font-size="15">Announced</text>
        <text x="150" y="140" text-anchor="middle" fill="#DDA11D" font-size="16" font-weight="700">STEP 1</text>
        <circle cx="380" cy="180" r="18" fill="#B5D4F4"/>
        <text x="380" y="230" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">DESIGN</text>
        <text x="380" y="252" text-anchor="middle" fill="#888780" font-size="15">Engineering</text>
        <text x="380" y="140" text-anchor="middle" fill="#0075C1" font-size="16" font-weight="700">STEP 2</text>
        <circle cx="610" cy="180" r="18" fill="#B5D4F4"/>
        <text x="610" y="230" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">BUILD</text>
        <text x="610" y="252" text-anchor="middle" fill="#888780" font-size="15">Construction</text>
        <text x="610" y="140" text-anchor="middle" fill="#0075C1" font-size="16" font-weight="700">STEP 3</text>
        <circle cx="800" cy="180" r="18" fill="#B5D4F4" stroke="#DDA11D" stroke-width="3"/>
        <text x="800" y="230" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">EXPANDED</text>
        <text x="800" y="252" text-anchor="middle" fill="#888780" font-size="15">Capacity</text>
        <text x="800" y="140" text-anchor="middle" fill="#DDA11D" font-size="16" font-weight="700">GOAL</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Norfolk</span>, USA</div></div>
    <div class="fact"><div class="k">PROJECT</div><div class="v">WWTP Expansion</div></div>
    <div class="fact"><div class="k">STATUS</div><div class="v"><span class="b">Funding Secured</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
