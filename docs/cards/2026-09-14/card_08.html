<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 22px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY · WWTP<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Anyang</span> Council <span class="b">Field Visit</span> to <span class="y">Seoksu</span> Sewage Plant</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="80" width="200" height="160" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="160" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Influent</text>
        <text x="160" y="165" text-anchor="middle" font-size="15" fill="#888780">Municipal sewage</text>
        <circle cx="160" cy="200" r="14" fill="#0075C1"/>

        <polygon points="270,150 320,150 320,135 345,160 320,185 320,170 270,170" fill="#0075C1"/>

        <rect x="355" y="80" width="200" height="160" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="455" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Treatment</text>
        <text x="455" y="165" text-anchor="middle" font-size="15" fill="#888780">Bio + Filtration</text>
        <circle cx="425" cy="200" r="12" fill="#00205D"/>
        <circle cx="455" cy="200" r="12" fill="#0075C1"/>
        <circle cx="485" cy="200" r="12" fill="#DDA11D"/>

        <polygon points="565,150 615,150 615,135 640,160 615,185 615,170 565,170" fill="#0075C1"/>

        <rect x="650" y="80" width="200" height="160" rx="14" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="750" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Effluent</text>
        <text x="750" y="165" text-anchor="middle" font-size="15" fill="#DDA11D">Discharge to river</text>
        <circle cx="750" cy="200" r="14" fill="#DDA11D"/>

        <text x="450" y="290" text-anchor="middle" font-size="18" fill="#888780">Council field inspection covers full sewage treatment train</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Oversight</span></div></div>
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Anyang</span></div></div>
    <div class="fact"><div class="k">PLANT</div><div class="v"><span class="y">Seoksu WWTP</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
