<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 22px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>REUSE · AI<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle">Water Stewardship in the Age of <span class="y">AI</span>: Maximizing <span class="b">Reuse</span> in Data Centers</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="130" width="180" height="80" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="120" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Data Center</text>
        <text x="120" y="192" text-anchor="middle" font-size="16" fill="#0075C1">Cooling Load</text>

        <polygon points="215,160 275,160 275,145 300,170 275,195 275,180 215,180" fill="#0075C1"/>

        <rect x="305" y="90" width="290" height="160" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="450" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">Reuse Loop</text>
        <circle cx="380" cy="180" r="28" fill="#0075C1"/>
        <text x="380" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">UF</text>
        <circle cx="450" cy="180" r="28" fill="#00205D"/>
        <text x="450" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RO</text>
        <circle cx="520" cy="180" r="28" fill="#DDA11D"/>
        <text x="520" y="187" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">UV</text>

        <polygon points="600,160 660,160 660,145 685,170 660,195 660,180 600,180" fill="#0075C1"/>

        <rect x="690" y="130" width="180" height="80" rx="12" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="780" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Reclaimed</text>
        <text x="780" y="192" text-anchor="middle" font-size="16" fill="#DDA11D">Cooling Water</text>

        <text x="450" y="290" text-anchor="middle" font-size="18" fill="#888780">Closed-loop water reuse reduces freshwater withdrawal in hyperscale facilities</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Water Reuse</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v">AI Data Center Cooling</div></div>
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="y">UF · RO · UV</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
