<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 22px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY · WWTP<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Anyang</span> Urban Transport Committee Visits <span class="y">Seoksu</span> <span class="b">WWTP</span></div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="450" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#00205D">Inspection Agenda</text>
        <line x1="100" y1="160" x2="800" y2="160" stroke="#B5D4F4" stroke-width="3"/>

        <circle cx="180" cy="160" r="26" fill="#0075C1"/>
        <text x="180" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
        <text x="180" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Site Briefing</text>
        <text x="180" y="245" text-anchor="middle" font-size="13" fill="#888780">Facility overview</text>

        <circle cx="360" cy="160" r="26" fill="#0075C1"/>
        <text x="360" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
        <text x="360" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Process Tour</text>
        <text x="360" y="245" text-anchor="middle" font-size="13" fill="#888780">Treatment lines</text>

        <circle cx="540" cy="160" r="26" fill="#DDA11D"/>
        <text x="540" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
        <text x="540" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Q&amp;A</text>
        <text x="540" y="245" text-anchor="middle" font-size="13" fill="#888780">Operations issues</text>

        <circle cx="720" cy="160" r="26" fill="#00205D"/>
        <text x="720" y="167" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
        <text x="720" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#00205D">Policy Report</text>
        <text x="720" y="245" text-anchor="middle" font-size="13" fill="#888780">Council follow-up</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">COMMITTEE</div><div class="v"><span class="b">Urban Transport</span></div></div>
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Anyang</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v"><span class="y">Seoksu WWTP</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
