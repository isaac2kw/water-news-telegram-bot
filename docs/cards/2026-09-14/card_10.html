<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 22px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MEMBRANE · UF/MF<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle"><span class="y">UF</span>/<span class="y">MF</span> Membranes Enable Water <span class="b">Reuse</span> for <span class="y">AI</span> Data Centers</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="340" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg">
        <text x="60" y="55" font-size="20" font-weight="700" fill="#00205D">Membrane Pore Size vs. Target</text>

        <rect x="60" y="90" width="380" height="90" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="90" y="125" font-size="24" font-weight="700" fill="#0075C1">MF</text>
        <text x="90" y="155" font-size="16" fill="#00205D">0.1–10 μm</text>
        <text x="200" y="140" font-size="15" fill="#888780">Suspended solids,</text>
        <text x="200" y="160" font-size="15" fill="#888780">bacteria, turbidity</text>

        <rect x="460" y="90" width="380" height="90" rx="12" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="490" y="125" font-size="24" font-weight="700" fill="#DDA11D">UF</text>
        <text x="490" y="155" font-size="16" fill="#00205D">0.01–0.1 μm</text>
        <text x="600" y="140" font-size="15" fill="#888780">Colloids, viruses,</text>
        <text x="600" y="160" font-size="15" fill="#888780">macromolecules</text>

        <rect x="60" y="210" width="780" height="100" rx="12" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="90" y="245" font-size="18" font-weight="700" fill="#00205D">Application: Data Center Reuse</text>
        <text x="90" y="275" font-size="15" fill="#888780">Pretreatment for cooling tower makeup &amp; RO feed</text>
        <text x="90" y="295" font-size="15" fill="#888780">High recovery · Low fouling · Compact footprint</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">UF / MF Membrane</span></div></div>
    <div class="fact"><div class="k">USE CASE</div><div class="v"><span class="y">AI Data Center</span></div></div>
    <div class="fact"><div class="k">ROLE</div><div class="v">Reuse Pretreatment</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
