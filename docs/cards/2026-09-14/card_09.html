<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:48px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:22px 22px;}
  .fact .k{color:var(--gray-light);font-size:16px;letter-spacing:1px;margin-bottom:8px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MOU · GLOBAL BIZ<span class="lbadge">KR·US</span></div>
    <div class="ctitle"><span class="y">KWWA</span> · <span class="y">AWWA</span> · <span class="y">K-water</span> Sign <span class="b">MOU</span> for US Water Market Entry</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="110" width="200" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="140" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">KWWA</text>
        <text x="140" y="185" text-anchor="middle" font-size="14" fill="#0075C1">Korea Water &amp;</text>
        <text x="140" y="205" text-anchor="middle" font-size="14" fill="#0075C1">Wastewater Assoc.</text>

        <rect x="350" y="110" width="200" height="120" rx="14" fill="#E6F1FB" stroke="#DDA11D" stroke-width="2"/>
        <text x="450" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">AWWA</text>
        <text x="450" y="185" text-anchor="middle" font-size="14" fill="#DDA11D">American Water</text>
        <text x="450" y="205" text-anchor="middle" font-size="14" fill="#DDA11D">Works Assoc.</text>

        <rect x="660" y="110" width="200" height="120" rx="14" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="760" y="155" text-anchor="middle" font-size="22" font-weight="700" fill="#00205D">K-water</text>
        <text x="760" y="185" text-anchor="middle" font-size="14" fill="#0075C1">Korea Water</text>
        <text x="760" y="205" text-anchor="middle" font-size="14" fill="#0075C1">Resources Corp.</text>

        <circle cx="450" cy="70" r="30" fill="#00205D"/>
        <text x="450" y="78" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">MOU</text>
        <line x1="140" y1="110" x2="430" y2="90" stroke="#00205D" stroke-width="3"/>
        <line x1="450" y1="100" x2="450" y2="110" stroke="#00205D" stroke-width="3"/>
        <line x1="760" y1="110" x2="470" y2="90" stroke="#00205D" stroke-width="3"/>

        <text x="450" y="285" text-anchor="middle" font-size="18" fill="#888780">Tri-party MOU to help Korean firms enter the US water market</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">Global Partnership</span></div></div>
    <div class="fact"><div class="k">PARTNERS</div><div class="v"><span class="y">KWWA·AWWA·K-water</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">US Water Market</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
