<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_02">
  <div class="pad">
    <div class="label"><span class="ldot"></span>WORKFORCE &amp; EDUCATION<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">KWWA</span> Nurtures the Next Generation of <span class="b">Water Industry</span> Talent</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="130" width="180" height="80" rx="12" fill="#E6F1FB"/>
        <text x="130" y="165" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0075C1">Students</text>
        <text x="130" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">University</text>

        <line x1="220" y1="170" x2="360" y2="170" stroke="#0075C1" stroke-width="3"/>
        <polygon points="360,170 348,163 348,177" fill="#0075C1"/>

        <circle cx="450" cy="170" r="80" fill="#00205D"/>
        <text x="450" y="160" text-anchor="middle" font-family="Helvetica" font-size="22" font-weight="700" fill="#DDA11D">KWWA</text>
        <text x="450" y="188" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#ffffff">Training Programs</text>

        <line x1="540" y1="170" x2="680" y2="170" stroke="#0075C1" stroke-width="3"/>
        <polygon points="680,170 668,163 668,177" fill="#0075C1"/>

        <rect x="680" y="130" width="180" height="80" rx="12" fill="#E6F1FB"/>
        <text x="770" y="165" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#0075C1">Water Sector</text>
        <text x="770" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">Future Careers</text>

        <text x="450" y="60" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Talent Pipeline</text>
        <line x1="330" y1="80" x2="570" y2="80" stroke="#B5D4F4" stroke-width="2"/>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">HOST</div><div class="v"><span class="y">KWWA</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v"><span class="b">Talent</span> Development</div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">Water Industry</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
