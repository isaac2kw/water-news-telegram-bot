<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_04">
  <div class="pad">
    <div class="label"><span class="ldot"></span>COMPLIANCE · INSPECTION<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Namwon</span> Mayor Inspects <span class="y">Daejeong WWTP</span> After <span class="b">Effluent</span> Exceedance</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="80" width="200" height="140" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="140" y="130" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Daejeong WWTP</text>
        <text x="140" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Treatment Facility</text>
        <rect x="70" y="180" width="140" height="24" rx="6" fill="#E6F1FB"/>
        <text x="140" y="197" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#0075C1">Effluent Discharge</text>

        <polygon points="240,150 300,135 300,165" fill="#DDA11D"/>
        <line x1="240" y1="150" x2="300" y2="150" stroke="#DDA11D" stroke-width="3"/>

        <rect x="320" y="80" width="240" height="140" rx="14" fill="#DDA11D" opacity="0.15" stroke="#DDA11D" stroke-width="2"/>
        <text x="440" y="130" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#DDA11D">EXCEEDANCE</text>
        <text x="440" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">Water Quality Alert</text>
        <text x="440" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">Standards Violated</text>

        <polygon points="560,150 620,135 620,165" fill="#0075C1"/>
        <line x1="560" y1="150" x2="620" y2="150" stroke="#0075C1" stroke-width="3"/>

        <rect x="640" y="80" width="220" height="140" rx="14" fill="#00205D"/>
        <text x="750" y="130" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#DDA11D">MAYOR VISIT</text>
        <text x="750" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">On-site Inspection</text>
        <text x="750" y="190" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Prevention Order</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Namwon</span></div></div>
    <div class="fact"><div class="k">FACILITY</div><div class="v"><span class="y">Daejeong</span> WWTP</div></div>
    <div class="fact"><div class="k">ACTION</div><div class="v"><span class="b">Prevention</span> Order</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
