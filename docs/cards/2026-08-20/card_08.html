<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>TECHNOLOGY · MBR<span class="lbadge">AUSTRALIA</span></div>
    <div class="ctitle"><span class="y">Australia</span>'s Largest Inland WWTP Adopts <span class="b">MemCor MBR</span> System for Expansion</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <text x="450" y="45" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">MBR Treatment Process</text>

        <rect x="40" y="90" width="160" height="140" rx="14" fill="#E6F1FB"/>
        <text x="120" y="140" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="700" fill="#0075C1">Raw</text>
        <text x="120" y="165" text-anchor="middle" font-family="Helvetica" font-size="16" font-weight="700" fill="#0075C1">Sewage</text>
        <text x="120" y="200" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#00205D">Inflow</text>

        <polygon points="210,160 260,148 260,172" fill="#0075C1"/>
        <line x1="200" y1="160" x2="260" y2="160" stroke="#0075C1" stroke-width="3"/>

        <rect x="270" y="80" width="180" height="160" rx="14" fill="#F5F7FA" stroke="#0075C1" stroke-width="2"/>
        <text x="360" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">Bioreactor</text>
        <rect x="290" y="140" width="140" height="60" rx="6" fill="#00205D"/>
        <text x="360" y="165" text-anchor="middle" font-family="Helvetica" font-size="12" font-weight="700" fill="#DDA11D">MemCor</text>
        <text x="360" y="185" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#ffffff">Membrane Module</text>
        <text x="360" y="220" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#888780">MBR System</text>

        <polygon points="460,160 510,148 510,172" fill="#0075C1"/>
        <line x1="450" y1="160" x2="510" y2="160" stroke="#0075C1" stroke-width="3"/>

        <rect x="520" y="90" width="160" height="140" rx="14" fill="#F5F7FA"/>
        <text x="600" y="140" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">Filtration</text>
        <text x="600" y="170" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#0075C1">Solid-Liquid</text>
        <text x="600" y="190" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#0075C1">Separation</text>

        <polygon points="690,160 740,148 740,172" fill="#0075C1"/>
        <line x1="680" y1="160" x2="740" y2="160" stroke="#0075C1" stroke-width="3"/>

        <rect x="750" y="90" width="120" height="140" rx="14" fill="#DDA11D" opacity="0.2" stroke="#DDA11D" stroke-width="2"/>
        <text x="810" y="140" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#DDA11D">Clean</text>
        <text x="810" y="165" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#DDA11D">Water</text>
        <text x="810" y="200" text-anchor="middle" font-family="Helvetica" font-size="12" fill="#00205D">Effluent</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">COUNTRY</div><div class="v"><span class="y">Australia</span></div></div>
    <div class="fact"><div class="k">TECH</div><div class="v"><span class="b">MemCor</span> MBR</div></div>
    <div class="fact"><div class="k">SCALE</div><div class="v">Largest Inland WWTP</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
