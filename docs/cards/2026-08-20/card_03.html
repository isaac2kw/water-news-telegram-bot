<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_03">
  <div class="pad">
    <div class="label"><span class="ldot"></span>EVENT · CAREER CAMP<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">KWWA</span> Wraps Up 2026 <span class="b">Water Industry</span> Career Camp for University Students</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <line x1="60" y1="150" x2="840" y2="150" stroke="#B5D4F4" stroke-width="3"/>
        <circle cx="120" cy="150" r="16" fill="#0075C1"/>
        <text x="120" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">DAY 1</text>
        <text x="120" y="200" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Orientation</text>

        <circle cx="300" cy="150" r="16" fill="#0075C1"/>
        <text x="300" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">DAY 2</text>
        <text x="300" y="200" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Lectures</text>

        <circle cx="480" cy="150" r="16" fill="#0075C1"/>
        <text x="480" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">DAY 3</text>
        <text x="480" y="200" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Site Visits</text>

        <circle cx="660" cy="150" r="16" fill="#0075C1"/>
        <text x="660" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">DAY 4</text>
        <text x="660" y="200" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Workshops</text>

        <circle cx="820" cy="150" r="20" fill="#DDA11D"/>
        <text x="820" y="120" text-anchor="middle" font-family="Helvetica" font-size="14" font-weight="700" fill="#00205D">FINAL</text>
        <text x="820" y="205" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#888780">Wrap-Up</text>

        <text x="450" y="50" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D">2026 Water Industry Career Camp</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">HOST</div><div class="v"><span class="y">KWWA</span></div></div>
    <div class="fact"><div class="k">TARGET</div><div class="v">University Students</div></div>
    <div class="fact"><div class="k">OUTCOME</div><div class="v"><span class="b">Strong</span> Response</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
