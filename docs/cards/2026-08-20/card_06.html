<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>CONTRACT · O&amp;M<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">MMSD</span> Committee Recommends <span class="y">Jacobs</span> Replace <span class="y">Veolia</span> at WWTPs</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="60" y="90" width="200" height="140" rx="14" fill="#F5F7FA" stroke="#B5D4F4" stroke-width="2"/>
        <text x="160" y="145" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#888780" text-decoration="line-through">Veolia</text>
        <text x="160" y="180" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#888780">Outgoing Contractor</text>

        <polygon points="290,160 360,145 360,175" fill="#DDA11D"/>
        <line x1="280" y1="160" x2="360" y2="160" stroke="#DDA11D" stroke-width="4"/>
        <text x="320" y="135" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#DDA11D">REPLACE</text>

        <rect x="380" y="90" width="200" height="140" rx="14" fill="#00205D"/>
        <text x="480" y="145" text-anchor="middle" font-family="Helvetica" font-size="24" font-weight="700" fill="#DDA11D">Jacobs</text>
        <text x="480" y="180" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">New Contractor</text>

        <polygon points="610,160 680,145 680,175" fill="#0075C1"/>
        <line x1="600" y1="160" x2="680" y2="160" stroke="#0075C1" stroke-width="4"/>

        <rect x="700" y="90" width="160" height="140" rx="14" fill="#E6F1FB"/>
        <text x="780" y="145" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#0075C1">MMSD</text>
        <text x="780" y="175" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#00205D">WWTPs</text>
        <text x="780" y="195" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#00205D">Operator</text>

        <text x="450" y="60" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#00205D">Committee Recommendation</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">AGENCY</div><div class="v"><span class="y">MMSD</span></div></div>
    <div class="fact"><div class="k">IN</div><div class="v"><span class="y">Jacobs</span></div></div>
    <div class="fact"><div class="k">OUT</div><div class="v"><span class="y">Veolia</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
