<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;letter-spacing:.2px;}
  .logo .h{color:var(--main-blue);}
  .logo .m{color:var(--yellow);}
  .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}
  .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}
  .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_05">
  <div class="pad">
    <div class="label"><span class="ldot"></span>INVESTMENT · WATER REUSE<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">HASI</span> Invests in <span class="y">Washington</span> Wastewater &amp; <span class="b">Water Reuse</span> Facility</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="60" width="200" height="200" rx="14" fill="#00205D"/>
        <text x="140" y="130" text-anchor="middle" font-family="Helvetica" font-size="26" font-weight="700" fill="#DDA11D">HASI</text>
        <text x="140" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Sustainable</text>
        <text x="140" y="180" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#ffffff">Infrastructure</text>
        <text x="140" y="215" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#B5D4F4">Investor</text>

        <line x1="240" y1="160" x2="340" y2="160" stroke="#0075C1" stroke-width="4"/>
        <polygon points="340,160 325,152 325,168" fill="#0075C1"/>
        <text x="290" y="145" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#0075C1">INVEST</text>

        <rect x="360" y="60" width="200" height="200" rx="14" fill="#E6F1FB"/>
        <text x="460" y="130" text-anchor="middle" font-family="Helvetica" font-size="20" font-weight="700" fill="#00205D">WWTP</text>
        <text x="460" y="160" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">Washington</text>
        <text x="460" y="180" text-anchor="middle" font-family="Helvetica" font-size="14" fill="#00205D">State Facility</text>

        <line x1="560" y1="160" x2="660" y2="160" stroke="#0075C1" stroke-width="4"/>
        <polygon points="660,160 645,152 645,168" fill="#0075C1"/>
        <text x="610" y="145" text-anchor="middle" font-family="Helvetica" font-size="13" font-weight="700" fill="#0075C1">TREAT</text>

        <rect x="680" y="60" width="180" height="200" rx="14" fill="#DDA11D" opacity="0.2" stroke="#DDA11D" stroke-width="2"/>
        <text x="770" y="130" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#DDA11D">WATER</text>
        <text x="770" y="155" text-anchor="middle" font-family="Helvetica" font-size="18" font-weight="700" fill="#DDA11D">REUSE</text>
        <text x="770" y="195" text-anchor="middle" font-family="Helvetica" font-size="13" fill="#00205D">Recycled Output</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">INVESTOR</div><div class="v"><span class="y">HASI</span></div></div>
    <div class="fact"><div class="k">LOCATION</div><div class="v"><span class="y">Washington</span></div></div>
    <div class="fact"><div class="k">FOCUS</div><div class="v"><span class="b">Water Reuse</span></div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
