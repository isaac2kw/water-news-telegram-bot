<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{margin:0;padding:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);}.logo .m{color:var(--yellow);}.logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:56px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);}.ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:26px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);}.fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_06">
  <div class="pad">
    <div class="label"><span class="ldot"></span>PFAS · UPGRADE<span class="lbadge">USA</span></div>
    <div class="ctitle"><span class="y">Parkersburg</span> Nears Groundbreaking on <span class="b">PFAS</span> Water Treatment Upgrade</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="90" width="180" height="120" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="120" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Raw Source</text>
        <text x="120" y="175" text-anchor="middle" font-size="16" fill="#DDA11D">PFAS Present</text>
        <polygon points="220,150 265,140 265,160" fill="#0075C1"/>
        <rect x="275" y="90" width="200" height="120" rx="12" fill="#E6F1FB"/>
        <text x="375" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0075C1">New PFAS</text>
        <text x="375" y="170" text-anchor="middle" font-size="20" font-weight="700" fill="#0075C1">Treatment</text>
        <polygon points="485,150 530,140 530,160" fill="#0075C1"/>
        <rect x="540" y="90" width="180" height="120" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="630" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#00205D">Compliance</text>
        <text x="630" y="175" text-anchor="middle" font-size="16" fill="#00205D">Testing</text>
        <polygon points="730,150 775,140 775,160" fill="#0075C1"/>
        <rect x="785" y="90" width="90" height="120" rx="12" fill="#DDA11D"/>
        <text x="830" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Safe</text>
        <text x="830" y="170" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Water</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">CATEGORY</div><div class="v"><span class="b">PFAS</span></div></div>
    <div class="fact"><div class="k">CITY</div><div class="v"><span class="y">Parkersburg</span></div></div>
    <div class="fact"><div class="k">STATUS</div><div class="v">Pre-Construction</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
