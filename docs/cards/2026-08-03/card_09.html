<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_09">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MODERNIZATION · SEWAGE<span class="lbadge">NEW ZEALAND</span></div>
    <div class="ctitle"><span class="y">South Wairarapa</span> Starts <span class="b">Modernization</span> of 3 Sewage Treatment Plants</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="60" width="260" height="70" rx="10" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="160" y="90" text-anchor="middle" fill="#888780" font-size="14" letter-spacing="1">CURRENT</text>
        <text x="160" y="115" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Aging STPs</text>
        <polygon points="300,95 360,80 360,110" fill="#0075C1"/>
        <rect x="370" y="40" width="180" height="110" rx="10" fill="#DDA11D"/>
        <text x="460" y="80" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">MODERNIZE</text>
        <text x="460" y="110" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">3 Plants</text>
        <text x="460" y="135" text-anchor="middle" fill="#ffffff" font-size="14">Project Launch</text>
        <polygon points="560,95 620,80 620,110" fill="#0075C1"/>
        <rect x="630" y="60" width="230" height="70" rx="10" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="745" y="90" text-anchor="middle" fill="#0075C1" font-size="14" letter-spacing="1">UPGRADED</text>
        <text x="745" y="115" text-anchor="middle" fill="#00205D" font-size="20" font-weight="700">Modern STPs</text>
        <g transform="translate(150,190)">
          <circle cx="30" cy="30" r="30" fill="#0075C1"/>
          <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">1</text>
          <text x="30" y="90" text-anchor="middle" fill="#00205D" font-size="14">STP A</text>
        </g>
        <g transform="translate(400,190)">
          <circle cx="30" cy="30" r="30" fill="#0075C1"/>
          <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">2</text>
          <text x="30" y="90" text-anchor="middle" fill="#00205D" font-size="14">STP B</text>
        </g>
        <g transform="translate(650,190)">
          <circle cx="30" cy="30" r="30" fill="#0075C1"/>
          <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">3</text>
          <text x="30" y="90" text-anchor="middle" fill="#00205D" font-size="14">STP C</text>
        </g>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">South Wairarapa</span></div></div>
    <div class="fact"><div class="k">PLANTS</div><div class="v"><span class="b">3 STPs</span></div></div>
    <div class="fact"><div class="k">TYPE</div><div class="v">Modernization</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
