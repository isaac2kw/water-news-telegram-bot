<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:40px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:22px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_08">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MEMBRANE · TECHNOLOGY<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle">Review Maps <span class="b">Five Routes</span> to <span class="y">PFAS-Free</span> High-Performance Membranes</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <circle cx="450" cy="160" r="55" fill="#DDA11D"/>
        <text x="450" y="155" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">PFAS-FREE</text>
        <text x="450" y="180" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">MEMBRANE</text>
        <line x1="450" y1="105" x2="150" y2="50" stroke="#0075C1" stroke-width="2"/>
        <line x1="450" y1="105" x2="750" y2="50" stroke="#0075C1" stroke-width="2"/>
        <line x1="405" y1="160" x2="80" y2="160" stroke="#0075C1" stroke-width="2"/>
        <line x1="495" y1="160" x2="820" y2="160" stroke="#0075C1" stroke-width="2"/>
        <line x1="450" y1="215" x2="450" y2="280" stroke="#0075C1" stroke-width="2"/>
        <rect x="60" y="20" width="180" height="60" rx="10" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="150" y="45" text-anchor="middle" fill="#0075C1" font-size="14" font-weight="700">ROUTE 1</text>
        <text x="150" y="68" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Bio-Polymers</text>
        <rect x="660" y="20" width="180" height="60" rx="10" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="750" y="45" text-anchor="middle" fill="#0075C1" font-size="14" font-weight="700">ROUTE 2</text>
        <text x="750" y="68" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Ceramics</text>
        <rect x="20" y="130" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="85" y="155" text-anchor="middle" fill="#0075C1" font-size="14" font-weight="700">ROUTE 3</text>
        <text x="85" y="178" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Hydrocarbon</text>
        <rect x="750" y="130" width="130" height="60" rx="10" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="815" y="155" text-anchor="middle" fill="#0075C1" font-size="14" font-weight="700">ROUTE 4</text>
        <text x="815" y="178" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Composites</text>
        <rect x="360" y="280" width="180" height="30" rx="10" fill="#E6F1FB" stroke="#0075C1"/>
        <text x="450" y="301" text-anchor="middle" fill="#00205D" font-size="15" font-weight="700">ROUTE 5 · Blends</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">TOPIC</div><div class="v"><span class="y">PFAS-Free</span> Membranes</div></div>
    <div class="fact"><div class="k">PATHWAYS</div><div class="v"><span class="b">5 Routes</span></div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">High Performance</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
