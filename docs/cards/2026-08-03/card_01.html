<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:52px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_01">
  <div class="pad">
    <div class="label"><span class="ldot"></span>POLICY · DIAGNOSIS<span class="lbadge">KOREA</span></div>
    <div class="ctitle"><span class="y">Yesan County</span> Runs <span class="b">Tech Diagnosis</span> on 3 Public Wastewater Plants</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="320" viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="120" width="200" height="90" rx="12" fill="#E6F1FB" stroke="#0075C1" stroke-width="2"/>
        <text x="120" y="155" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">Yesan County</text>
        <text x="120" y="180" text-anchor="middle" fill="#0075C1" font-size="14">Local Government</text>
        <polygon points="230,165 285,150 285,180" fill="#0075C1"/>
        <circle cx="450" cy="165" r="70" fill="#DDA11D"/>
        <text x="450" y="160" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">TECH</text>
        <text x="450" y="185" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">DIAGNOSIS</text>
        <polygon points="615,150 670,165 615,180" fill="#0075C1"/>
        <rect x="680" y="60" width="200" height="70" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="780" y="90" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Plant #1</text>
        <text x="780" y="112" text-anchor="middle" fill="#888780" font-size="13">Public WWTP</text>
        <rect x="680" y="140" width="200" height="70" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="780" y="170" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Plant #2</text>
        <text x="780" y="192" text-anchor="middle" fill="#888780" font-size="13">Public WWTP</text>
        <rect x="680" y="220" width="200" height="70" rx="12" fill="#F5F7FA" stroke="#B5D4F4"/>
        <text x="780" y="250" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">Plant #3</text>
        <text x="780" y="272" text-anchor="middle" fill="#888780" font-size="13">Public WWTP</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">SCOPE</div><div class="v"><span class="b">3 Public Plants</span></div></div>
    <div class="fact"><div class="k">REGION</div><div class="v"><span class="y">Yesan, Chungnam</span></div></div>
    <div class="fact"><div class="k">GOAL</div><div class="v">Efficiency Review</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
