<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root{--main-blue:#0075C1;--yellow:#DDA11D;--navy:#00205D;--tint:#E6F1FB;--card-bg:#F5F7FA;--line:#B5D4F4;--gray-light:#888780;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;}
  .card{width:1080px;height:1080px;background:#ffffff;position:relative;overflow:hidden;}
  .pad{padding:0 90px;}
  .footer{position:absolute;left:0;right:0;bottom:46px;padding:0 90px;}
  .footer .line{height:1px;background:var(--line);margin-bottom:22px;}
  .footer .row{display:flex;align-items:center;justify-content:space-between;}
  .logo{font-size:26px;font-weight:700;}
  .logo .h{color:var(--main-blue);} .logo .m{color:var(--yellow);} .logo .inc{color:var(--navy);}
  .footer .center{color:var(--main-blue);font-size:22px;font-weight:600;letter-spacing:2px;}
  .footer .right{width:120px;}
  .label{display:flex;align-items:center;gap:12px;padding-top:96px;color:var(--main-blue);font-size:24px;font-weight:700;letter-spacing:3px;}
  .label .ldot{width:10px;height:10px;border-radius:50%;background:var(--main-blue);}
  .label .lbadge{margin-left:6px;background:var(--tint);color:var(--main-blue);font-size:18px;letter-spacing:2px;padding:5px 14px;border-radius:20px;}
  .ctitle{margin-top:34px;color:var(--navy);font-size:50px;font-weight:700;line-height:1.18;}
  .ctitle .b{color:var(--main-blue);} .ctitle .y{color:var(--yellow);}
  .cdivider{width:160px;height:4px;background:var(--main-blue);margin-top:30px;}
  .info{margin-top:44px;}
  .facts{position:absolute;left:90px;right:90px;bottom:150px;display:flex;gap:18px;}
  .fact{flex:1;background:var(--card-bg);border-radius:16px;padding:26px 24px;}
  .fact .k{color:var(--gray-light);font-size:18px;letter-spacing:1px;margin-bottom:10px;}
  .fact .v{color:var(--navy);font-size:24px;font-weight:700;line-height:1.25;}
  .fact .v .b{color:var(--main-blue);} .fact .v .y{color:var(--yellow);}
</style>
</head>
<body>
<div class="card" id="card_10">
  <div class="pad">
    <div class="label"><span class="ldot"></span>MARKET · CONSTRUCTION<span class="lbadge">GLOBAL</span></div>
    <div class="ctitle"><span class="b">Industrial Wastewater</span> Treatment Construction Booms in <span class="y">U.S.</span> and Beyond</div>
    <div class="cdivider"></div>
    <div class="info">
      <svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
        <line x1="80" y1="250" x2="820" y2="250" stroke="#B5D4F4" stroke-width="2"/>
        <line x1="80" y1="50" x2="80" y2="250" stroke="#B5D4F4" stroke-width="2"/>
        <rect x="140" y="130" width="100" height="120" fill="#DDA11D"/>
        <text x="190" y="118" text-anchor="middle" fill="#DDA11D" font-size="18" font-weight="700">USA</text>
        <text x="190" y="200" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700">HIGH</text>
        <rect x="310" y="170" width="100" height="80" fill="#0075C1"/>
        <text x="360" y="158" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700">Europe</text>
        <text x="360" y="218" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">MID</text>
        <rect x="480" y="160" width="100" height="90" fill="#0075C1"/>
        <text x="530" y="148" text-anchor="middle" fill="#0075C1" font-size="18" font-weight="700">Asia</text>
        <text x="530" y="215" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">MID</text>
        <rect x="650" y="190" width="100" height="60" fill="#B5D4F4"/>
        <text x="700" y="178" text-anchor="middle" fill="#00205D" font-size="18" font-weight="700">Other</text>
        <text x="700" y="230" text-anchor="middle" fill="#00205D" font-size="16" font-weight="700">LOW</text>
        <text x="450" y="280" text-anchor="middle" fill="#888780" font-size="14">Industrial WWT Construction Activity by Region</text>
      </svg>
    </div>
  </div>
  <div class="facts">
    <div class="fact"><div class="k">LEADER</div><div class="v"><span class="y">United States</span></div></div>
    <div class="fact"><div class="k">SECTOR</div><div class="v"><span class="b">Industrial WWT</span></div></div>
    <div class="fact"><div class="k">TREND</div><div class="v">Construction Boom</div></div>
  </div>
  <div class="footer">
    <div class="line"></div>
    <div class="row">
      <div class="logo"><span class="h">Hifil</span><span class="m">M</span>&nbsp;<span class="inc">INC.</span></div>
      <div class="center">Water Treatment</div>
      <div class="right"></div>
    </div>
  </div>
</div>
</body>
</html>
